<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meta do professor A · Foco agora</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="2026-11-27-meta-professor.css">
<style>
/* Mesmo desenho da Meta do consultor: o bloco Agora, a fila Depois e a lateral
   com a Agenda de hoje (só as aulas experimentais do professor). */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;margin-top:16px;align-items:start}

.agora{padding:22px 24px 20px;border-radius:20px;background:#fff;box-shadow:0 0 0 2px var(--blue) inset}
.ag-t{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ag-t .rot{font-size:13px;font-weight:600;color:var(--blue700)}
.mot{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:999px;background:rgba(245,158,11,.15);color:var(--amber700);font-size:12.5px;font-weight:600}
.mot.u{background:rgba(244,63,94,.10);color:var(--rose700)}
.ag-c{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;margin:18px 0}
.dias-big{display:grid;place-items:center;width:104px;height:104px;border-radius:22px;background:#fff8eb;color:var(--amber700);text-align:center}
.dias-big.u{background:#fff5f6;color:var(--rose700)}
.dias-big b{font:700 40px/1 'Space Grotesk',sans-serif;letter-spacing:-.03em}
.dias-big span{font-size:12px;font-weight:600;margin-top:-14px}
.ag-n{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ag-n h2{font-size:25px;font-weight:700;letter-spacing:-.02em}
.ag-n a{font-size:13px;font-weight:600;color:var(--blue700)}
.fatos{display:flex;gap:6px 22px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--ink2)}
.fatos b{font-weight:600;color:var(--ink)}
.pres{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}
.pres span{display:flex;gap:3px}
.pres i{width:16px;height:16px;border-radius:5px;background:#eef2f7}
.pres i.v{background:#10B981}
.resp{margin-top:10px;font-size:13px;color:var(--ink2)}
.resp b{font-weight:600}
.ag-f{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--rule)}
.pular{border:0;background:none;color:var(--muted);font-weight:600;cursor:pointer}
.ult{margin-top:12px;font-size:12.5px;color:var(--muted)}

.dep{margin-top:16px;overflow:hidden}
.dep-h{display:flex;justify-content:space-between;align-items:baseline;padding:16px 22px 10px}
.dep-h h3{font-size:15px;font-weight:700}
.fl{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;width:100%;padding:11px 22px;border:0;border-top:1px solid var(--rule);background:#fff;text-align:left;cursor:pointer}
.fl:hover{background:#f8faff}
.fl b{display:block;font-size:14px;font-weight:600}
.fl .s{font-size:12.5px;color:var(--muted)}
.fl .s.u{color:var(--rose700);font-weight:600}
.fl .n{font-size:13px;font-weight:700}

.lat{display:flex;flex-direction:column;gap:16px}
.lat > section{padding:18px 20px}
.lat h3{font-size:15px;font-weight:700}
.ag-h{display:flex;justify-content:space-between;align-items:baseline}
.ag-s{margin:2px 0 10px;font-size:12.5px}
.ag-l{list-style:none;margin:0;padding:0}
.ag-i{display:grid;grid-template-columns:44px 10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--rule)}
.ag-i:first-child{border-top:0}
.ag-hr{font-size:13px;font-weight:600}
.ag-p{width:9px;height:9px;border-radius:50%;background:#cbd5e1}
.ag-nm{display:flex;flex-direction:column;min-width:0}
.ag-nm a{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-nm span{font-size:12px}
.ag-e{font-size:12px;font-weight:600;white-space:nowrap;color:var(--muted)}
.st-veio .ag-p{background:#10B981}.st-veio .ag-e{color:#047857}
.st-faltou .ag-p{background:#F43F5E}.st-faltou .ag-e{color:var(--rose700)}
.st-sem .ag-p{background:#F59E0B}.st-sem .ag-e{color:var(--amber700)}
.st-proxima{margin:0 -10px;padding:9px 10px;border-radius:12px;background:var(--blue50);border-top-color:transparent}
.st-proxima .ag-p{background:var(--blue)}.st-proxima .ag-e{color:var(--blue700)}
.st-proxima + .ag-i{border-top-color:transparent}
.ag-n2{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule);font-size:12px;color:var(--muted)}

.marco{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.marco:first-of-type{margin-top:8px}
.feito{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--rule);font-size:13px}
.feito:first-of-type{margin-top:8px;border-top:0}
.feito .r{font-size:12px;font-weight:600}
.r.ok{color:#047857}.r.no{color:var(--muted)}.r.can{color:var(--rose700)}
/* troca de versão do bloco Agora, só do mockup */
.vers{display:flex;gap:4px;align-items:center;margin-top:14px;font-size:12.5px;color:var(--muted)}
.vers button{height:30px;padding:0 12px;border-radius:999px;border:1px dashed var(--faint);background:transparent;font-size:12.5px;font-weight:600;cursor:pointer}
.vers button[aria-pressed=true]{border-style:solid;border-color:var(--ink);background:var(--ink);color:#fff}

/* versão 1: régua de dias */
.v1 .hd{display:flex;align-items:center;gap:14px;margin:14px 0 4px}
.v1 .hd h2{font-size:24px;font-weight:700;letter-spacing:-.02em}
.v1 .hd a{font-size:13px;font-weight:600;color:var(--blue700)}
.v1 .sub{font-size:13px;color:var(--ink2)}
.v1 .sub b{font-weight:600}
.rg{position:relative;height:58px;margin:20px 6px 14px}
.rg .ln{position:absolute;left:0;right:0;top:22px;height:6px;border-radius:999px;background:linear-gradient(90deg,#FCD34D,#F59E0B 40%,#F97316 70%,#F43F5E)}
.rg .mk{position:absolute;top:34px;transform:translateX(-50%);font-size:11.5px;color:var(--muted);white-space:nowrap}
.rg .mk::before{content:"";position:absolute;left:50%;top:-14px;width:2px;height:10px;background:#fff}
.rg .ini{position:absolute;left:0;top:34px;font-size:11.5px;color:var(--muted)}
.rg .eu{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.rg .eu b{padding:2px 9px;border-radius:999px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;white-space:nowrap}
.rg .eu i{width:16px;height:16px;margin-top:-1px;border-radius:50%;background:#fff;border:4px solid var(--ink)}

/* versão 2: faixa na borda e frase */
.agora.v2{box-shadow:none;border:1px solid var(--line);border-left:6px solid #F59E0B;border-radius:18px}
.agora.v2.u{border-left-color:#F43F5E}
.v2c{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start;margin-top:12px}
/* o anel da foto, como o do app: âmbar, vermelho no urgente */
.foto{display:inline-grid;padding:3px;border-radius:50%;background:#F59E0B}
.foto.u{background:#F43F5E}
.foto .av{border:3px solid #fff}
.v2 .hd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.v2 .hd h2{font-size:26px;font-weight:700;letter-spacing:-.02em}
.v2 .hd a{font-size:13px;font-weight:600;color:var(--blue700)}
.v2 .frase{margin-top:6px;font-size:17px;color:var(--ink2)}
.v2 .frase b{color:var(--ink);font-weight:700}
.v2 .linha{display:flex;gap:6px 24px;flex-wrap:wrap;margin:14px 0 18px;font-size:13px;color:var(--muted)}
.v2 .linha b{color:var(--ink);font-weight:600}

/* versão 3: duas colunas, contato à direita */
.v3 .cols{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:22px;margin-top:14px}
.v3 h2{font-size:24px;font-weight:700;letter-spacing:-.02em}
.v3 .hd a{font-size:13px;font-weight:600;color:var(--blue700)}
.v3 dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0 0;font-size:13px}
.v3 dt{color:var(--muted)}.v3 dd{margin:0;font-weight:600}
.v3 .ctt{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:var(--paper)}
.v3 .ctt .q{font-size:12px;color:var(--muted)}
.v3 .ctt .who2{font-size:14px;font-weight:600}
.v3 .ctt .acts{flex-direction:column}
.v3 .ctt .acts > *{justify-content:center;width:100%}
.v3 .pi{margin-top:12px;display:flex;justify-content:space-between;align-items:center}
@media (max-width:1080px){.grid{grid-template-columns:1fr}}
@media (max-width:700px){.v3 .cols{grid-template-columns:1fr}}
@media (max-width:560px){.ag-c{grid-template-columns:1fr}.fl{grid-template-columns:auto minmax(0,1fr)}.fl .n,.fl .tk{display:none}}
</style></head><body><div class="wrap" id="app"></div><div id="vis"></div>
<div class="tag">Mockup A · Foco agora · dados de exemplo</div>
<script src="2026-11-27-faltosos-dados.js"></script>
<script src="2026-11-27-meta-professor-comum.js"></script>
<script>
const { F } = MP;
let agoraId = null;
// Aluno menor: o contato é o responsável (contactOf).
const RESP = { 'Murilo Teles': 'Carla Teles, mãe' };
const RESULT = { 'Sabrina Kopp': ['Vai voltar', 'ok'], 'Tatiane Kunz': ['Não respondeu', 'no'], 'Letícia Fagundes': ['Quer cancelar', 'can'] };
const presenca = (a) => { const vazias = Math.min(8, Math.ceil(a.dias / 7)); return Array.from({ length: 8 }, (_, i) => i < 8 - vazias); };
const semanas = (a) => `<div class="pres">Últimas 8 semanas <span aria-label="Semanas com presença">${presenca(a).map((v) => `<i class="${v ? 'v' : ''}"></i>`).join('')}</span></div>`;
const contato = (a) => (RESP[a.nome] ? `${RESP[a.nome]} (responsável)` : a.tel);
let versao = 2; // escolhida pelo Johnny em 27/11/2026
const topo = (a) => `<div class="ag-t"><span class="rot">Agora</span><span class="mot${a.urgente ? ' u' : ''}">${MP.motivo(a)}</span></div>`;
function agoraHtml(a) {
  if (versao === 1) {
    const MAXR = 75; const p = (d) => `${Math.min(d, MAXR) / MAXR * 100}%`;
    return `<section class="agora v1" aria-label="Agora">${topo(a)}
      <div class="hd">${F.avatar(a, 44)}<div><h2 class="d">${a.nome}</h2><a href="#">Abrir ficha</a></div></div>
      <p class="sub">${a.plano}, até <b class="num${a.urgente ? ' urgt' : ''}">${a.fim}</b>. Contato: <b class="num">${contato(a)}</b></p>
      <div class="rg" aria-label="${a.dias} dias sem vir"><span class="ln"></span><span class="ini num">${a.ultima}</span>
        ${F.MARCOS.map((m) => `<span class="mk" style="left:${p(m)}">${m} dias</span>`).join('')}
        <span class="eu" style="left:${p(a.dias)}"><b class="num">${a.dias} dias</b><i></i></span></div>
      <div class="ag-f">${MP.acoes(a)}<button type="button" class="pular" data-pular>Pular por agora</button></div>
      <p class="ult">${MP.ultimoContato(a)}.</p></section>`;
  }
  if (versao === 2) {
    return `<section class="agora v2${a.urgente ? ' u' : ''}" aria-label="Agora">${topo(a)}
      <div class="v2c"><span class="foto${a.urgente ? ' u' : ''}">${F.avatar(a, 64)}</span><div style="min-width:0">
      <div class="hd"><h2 class="d">${a.nome}</h2><a href="#">Abrir ficha</a></div>
      <p class="frase">Não vem há <b class="num">${a.dias} dias</b>, desde ${a.ultima}.${a.urgente ? ` O contrato termina em <b class="urgt num">${a.fim}</b>.` : ''}</p>
      <div class="linha"><span>${RESP[a.nome] ? 'Falar com' : 'Contato'} <b class="num">${contato(a)}</b></span><span>${MP.ultimoContato(a)}</span></div></div></div>
      <div class="ag-f">${MP.acoes(a)}<button type="button" class="pular" data-pular>Pular por agora</button></div></section>`;
  }
  return `<section class="agora v3" aria-label="Agora">${topo(a)}
    <div class="cols"><div style="min-width:0">
      <div class="hd" style="display:flex;align-items:center;gap:12px">${F.avatar(a, 44)}<div><h2 class="d">${a.nome}</h2><a href="#">Abrir ficha</a></div></div>
      <dl><dt>Sem vir</dt><dd class="num${a.urgente ? ' urgt' : ''}">${a.dias} dias, desde ${a.ultima}</dd><dt>Plano</dt><dd>${a.plano}</dd><dt>Contrato até</dt><dd class="num${a.urgente ? ' urgt' : ''}">${a.fim}</dd></dl>
      ${semanas(a)}</div>
      <div class="ctt"><span class="q">${RESP[a.nome] ? 'Falar com o responsável' : 'Falar com o aluno'}</span><span class="who2 num">${contato(a)}</span><span class="q">${MP.ultimoContato(a)}</span>${MP.acoes(a)}</div></div>
    <div class="pi"><span></span><button type="button" class="pular" data-pular>Pular por agora</button></div></section>`;
}
function render() {
  const fila = MP.pendentes();
  if (!fila.find((a) => a.id === agoraId)) agoraId = fila[0]?.id || null;
  const ag = fila.find((a) => a.id === agoraId);
  const resto = fila.filter((a) => a.id !== agoraId);
  const feitos = MP.feitos();
  const porMarco = [['Urgentes', fila.filter((a) => a.urgente).length], ...[60, 30, 14, 7].map((m) => [`${m} dias sem vir`, fila.filter((a) => !a.urgente && a.tarefa.marco === m).length])];
  document.getElementById('app').innerHTML = `
    ${MP.faixa()}
    <nav class="foco" role="tablist" aria-label="Foco em">
      <button class="fe" role="tab" aria-selected="true">Faltosos <span class="n num">${fila.length}</span></button>
      <button class="fe" role="tab" aria-disabled="true">Treinos a vencer <small>em breve</small></button>
      <button class="fe" role="tab" aria-disabled="true">Treinos vencidos <small>em breve</small></button>
    </nav>
    <div class="grid"><div>
      ${ag ? agoraHtml(ag) : '<section class="agora"><h2 class="d">Tudo feito nesta semana</h2><p class="mut">A próxima lista chega com a importação de segunda.</p></section>'}
      ${resto.length ? `<section class="card dep"><div class="dep-h"><h3 class="d">Depois</h3><span class="mut num">${resto.length}</span></div>${resto.map((a) => `<button type="button" class="fl" data-ag="${a.id}">${F.avatar(a, 30)}<span style="min-width:0"><b>${a.nome}</b><span class="s${a.urgente ? ' u' : ''}">${MP.motivo(a)}</span></span><span class="n num">${a.dias} dias</span>${F.chip(a.tarefa)}</button>`).join('')}</section>` : ''}
    </div>
    <aside class="lat">
      ${MP.agenda()}
      <section class="card"><h3 class="d">Faltosos na semana</h3>${porMarco.map(([n, q]) => `<div class="marco"><span${n === 'Urgentes' && q ? ' class="urgt"' : ''}>${n}</span><b class="num">${q}</b></div>`).join('')}</section>
      <section class="card"><h3 class="d">Feitos nesta semana</h3>${feitos.length ? feitos.map((a) => { const [t, c] = RESULT[a.nome] || ['Vai voltar', 'ok']; return `<div class="feito">${F.avatar(a, 26)}<span>${a.nome}</span><span class="r ${c}">${t}</span></div>`; }).join('') : '<p class="mut" style="margin-top:8px">Nenhum ainda.</p>'}</section>
    </aside></div>`;
  document.getElementById('vis').innerHTML = F.trocaVisao();
}
document.addEventListener('click', (e) => {
  const v = e.target.closest('[data-v]');
  if (v) { versao = Number(v.dataset.v); render(); return; }
  const a = e.target.closest('[data-ag]');
  if (a) { agoraId = a.dataset.ag; render(); return; }
  if (e.target.closest('[data-pular]')) { const f = MP.pendentes(); const i = f.findIndex((x) => x.id === agoraId); agoraId = f[(i + 1) % f.length]?.id; render(); }
});
MP.ligar(render);
render();
</script></body></html>
