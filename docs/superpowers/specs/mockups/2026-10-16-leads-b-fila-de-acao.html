<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leads B · Fila de ação</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="2026-10-16-leads-base.css">
<style>
.lay{display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px;margin-top:16px;align-items:start}
.rail{position:sticky;top:16px;padding:18px 10px 12px}
.rail h2{font-size:15px;font-weight:700;padding:0 10px 8px}
.rail a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;font-weight:500;color:var(--ink2)}
.rail a:hover{background:#f4f7fd}
.rail a b{font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums}
.rail .late{color:var(--rose700)}.rail .today{color:var(--amber700)}
.rail p{padding:10px 10px 4px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--rule);margin-top:6px}
.band{scroll-margin-top:8px}
.band+.band{margin-top:26px}
.bh{position:sticky;top:0;z-index:5;display:flex;align-items:baseline;gap:12px;padding:10px 4px;background:var(--paper)}
.bh h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.bh span{color:var(--muted)}
.tr{display:grid;grid-template-columns:92px minmax(0,1.6fr) 168px 120px;gap:16px;align-items:center;padding:0 22px 0 14px;min-height:66px;border-bottom:1px solid var(--rule)}
.card .tr:last-child{border-bottom:0}
.tr:hover{background:#f8faff}
.tr:focus-visible{outline-offset:-2px}
.tm{text-align:center;line-height:1}
.tm b{display:block;font-size:26px;font-weight:700;letter-spacing:-.03em}
.tm small{display:block;margin-top:4px;font-size:11.5px;color:var(--muted)}
.tm.late b{color:var(--rose700)}.tm.today b{color:var(--amber700)}.tm.none b{color:#b8c1d1;font-weight:500}
.mo{display:flex;justify-content:center;padding:12px}
.mo button{border:0;background:none;color:var(--blue700);font-weight:600;cursor:pointer}
@media (max-width:1180px){.lay{grid-template-columns:1fr}.rail{position:static;padding:14px 12px}.rail h2,.rail p{display:none}.rail #rail{display:flex;flex-wrap:wrap;gap:4px}.rail a{gap:10px}}
@media (max-width:760px){.tr{grid-template-columns:64px 1fr;gap:6px 12px;padding:12px 16px}.tr>:nth-child(n+3){grid-column:2}.cr{text-align:left}}
</style></head><body><div class="wrap" id="app"></div>
<div class="tag">Mockup B · Fila de ação · dados de exemplo</div>
<script src="2026-10-16-leads-dados.js"></script>
<script>
const {leads,NOW,chip,person,created,head,pF,pC,pFase,pS,cal}=LD;
const $=id=>document.getElementById(id);
const BANDS=[
  {id:'late',label:'Em atraso',base:23,tone:'late'},
  {id:'today',label:'Hoje',base:9,tone:'today'},
  {id:'week',label:'Próximos 6 dias',base:31},
  {id:'later',label:'Mais para frente',base:24},
  {id:'none',label:'Sem agendamento',base:75,note:'ninguém marcou o próximo passo'},
  {id:'closed',label:'Encerrados',base:50,note:'vendas e perdas'},
];
const pad=n=>String(n).padStart(2,'0');
const tm=l=>{
  if(!l.next)return `<div class="tm none"><b class="d">—</b>${l.band==='closed'?'':'<small>sem data</small>'}</div>`;
  const d=cal(NOW,l.next),h=`${pad(l.next.getHours())}:${pad(l.next.getMinutes())}`;
  const when=l.late?(d===0?'hoje':`há ${-d} ${-d===1?'dia':'dias'}`):d===0?'hoje':d===1?'amanhã':`${pad(l.next.getDate())}/${pad(l.next.getMonth()+1)}`;
  return `<div class="tm ${l.band==='late'?'late':l.band==='today'?'today':''}"><b class="d num">${h}</b><small>${when}</small></div>`;
};
const row=l=>`<a class="tr" href="#">${tm(l)}${person(l,36)}<span>${chip(l.stage)}</span>${created(l)}</a>`;
$('app').innerHTML=head('Agrupados pela próxima ação, de quem precisa de contato primeiro',pF+pC+pFase+pS)+
`<div class="lay"><nav class="card rail" aria-label="Próxima ação"><h2 class="d">Próxima ação</h2><div id="rail"></div><p>212 leads no funil</p></nav><main id="bands"></main></div>`;
$('rail').innerHTML=BANDS.map(b=>`<a href="#b-${b.id}"><span>${b.label}</span><b class="${b.tone||''}">${b.base}</b></a>`).join('');
$('bands').innerHTML=BANDS.map(b=>{
  const list=leads.filter(l=>l.band===b.id).sort((a,c)=>(a.next||0)-(c.next||0)||c.created-a.created);
  return `<section class="band" id="b-${b.id}"><header class="bh"><h2 class="d">${b.label}</h2><span class="num">${b.base} leads${b.note?', '+b.note:''}</span></header>
  <div class="card">${list.map(row).join('')}<div class="mo"><button type="button">Mostrar mais (${list.length} de ${b.base})</button></div></div></section>`;
}).join('');
</script></body></html>
