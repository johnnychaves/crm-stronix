<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes A · Carteira</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="2026-10-16-clientes-base.css">
<style>
.cart{margin-top:16px;padding:22px 24px 14px}
.cart-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cart h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.lnk{border:0;background:none;padding:0;color:var(--blue700);font-weight:600;cursor:pointer}
.strip{display:flex;gap:3px;height:16px}
.seg{border:0;padding:0;min-width:8px;background:var(--c);cursor:pointer;border-radius:4px;transition:opacity .15s}
.seg:first-child{border-radius:8px 4px 4px 8px}.seg:last-child{border-radius:4px 8px 8px 4px}
.legend{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.lg{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:10px 12px;border-radius:12px;border:0;background:transparent;cursor:pointer;transition:opacity .15s,background .15s}
.lg:hover{background:#f4f7fd}
.lg[aria-pressed=true]{background:var(--bg)}
.lt{display:inline-flex;align-items:center;gap:7px;font-weight:500;color:var(--ink2);white-space:nowrap}
.lt i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.lg b{font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.dim{opacity:.38}

.tbl{margin-top:16px;overflow:hidden}
.th,.tr{display:grid;grid-template-columns:minmax(240px,1.7fr) minmax(150px,1.1fr) 124px minmax(190px,1.2fr) 112px;gap:16px;align-items:center;padding:0 24px}
.th{height:44px;border-bottom:1px solid var(--rule);color:var(--muted);font-size:12.5px;font-weight:500}
.r{text-align:right}
.tr{min-height:62px;border-bottom:1px solid var(--rule)}
.tr:last-of-type{border-bottom:0}
.tr:hover{background:#f8faff}
.tr:focus-visible{outline-offset:-2px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .sub2{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.who .co{color:var(--blue700);font-weight:500}
.plan{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vg{min-width:0}
.vl{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:5px}
.vt{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.vt.warn{color:var(--t);font-weight:600}
.val{font-size:14px;font-weight:600;text-align:right}
@media (max-width:980px){.legend{grid-template-columns:repeat(4,minmax(0,1fr))}.th{display:none}.tr{grid-template-columns:1fr;gap:8px;padding:14px 20px}.val{text-align:left}}
</style></head><body><div class="wrap">
<header class="head"><div><h1 class="d">Clientes</h1><p class="sub">580 clientes na carteira, do vencimento mais próximo ao mais distante</p></div>
<div class="ctl"><button class="fp" type="button">Responsável <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg></button><button class="fp" type="button">Plano <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg></button></div></header>

<section class="card cart"><div class="cart-top"><h2 class="d">Situação da carteira</h2><p class="mut" id="hint"></p></div>
<div class="strip" id="strip" role="group" aria-label="Situação da carteira"></div><div class="legend" id="legend"></div></section>

<section class="card tbl"><div class="th"><span>Cliente</span><span>Plano</span><span>Situação</span><span>Vigência</span><span class="r">Valor</span></div>
<div id="rows"></div><div class="more"><button type="button" id="more"></button></div></section></div>
<div class="tag">Mockup A · Carteira · dados de exemplo</div>
<script src="2026-10-16-clientes-dados.js"></script>
<script>
const {clients,BASE,TOTAL,ORDER,STATUS,avatar,pill,brl,dmy,when}=CL;
const $=id=>document.getElementById(id);
const on=new Set();
$('strip').innerHTML=ORDER.map(s=>`<button type="button" class="seg s-${s}" data-s="${s}" style="flex:${BASE[s]}" aria-pressed="false" aria-label="${STATUS[s]}, ${BASE[s]} clientes"></button>`).join('');
$('legend').innerHTML=ORDER.map(s=>`<button type="button" class="lg s-${s}" data-s="${s}" aria-pressed="false"><span class="lt"><i></i>${STATUS[s]}</span><b class="d num">${BASE[s]}</b><span class="mut num">${Math.round(BASE[s]/TOTAL*100)}%</span></button>`).join('');
const row=c=>{
  const vg=c.pct==null?'<span class="mut">—</span>':`<div class="vg s-${c.st}"><div class="vl"><span class="vt${c.st==='a_vencer'?' warn':''}">${when(c)}</span><span class="mut num">${dmy(c.end)}</span></div><div class="bar"><i style="width:${Math.round(c.pct*100)}%"></i></div></div>`;
  return `<a class="tr" href="#">
    <div class="who">${avatar(c,34)}<div style="min-width:0"><b>${c.name}</b><div class="sub2"><span class="num">${c.phone}</span><span class="co">@${c.co}</span></div></div></div>
    <span class="plan">${c.plan||'<span class="mut">—</span>'}</span><span>${pill(c.st)}</span>${vg}
    <span class="val d num">${c.value==null?'<span class="mut">—</span>':brl(c.value)}</span></a>`;
};
function render(){
  document.querySelectorAll('[data-s]').forEach(b=>{const p=on.has(b.dataset.s);b.setAttribute('aria-pressed',p);b.classList.toggle('dim',on.size>0&&!p)});
  const list=clients.filter(c=>!on.size||on.has(c.st));
  const base=on.size?[...on].reduce((a,s)=>a+BASE[s],0):TOTAL;
  $('hint').innerHTML=on.size?`${base} clientes em ${[...on].map(s=>STATUS[s].toLowerCase()).join(' e ')}. <button type="button" class="lnk" data-clear>Limpar filtro</button>`:'Clique numa situação para filtrar a lista.';
  $('rows').innerHTML=list.map(row).join('');
  $('more').textContent=`Carregar mais (${list.length} de ${base})`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-s]');
  if(b){const s=b.dataset.s;on.has(s)?on.delete(s):on.add(s);render()}
  else if(e.target.closest('[data-clear]')){on.clear();render()}
});
render();
</script></body></html>
