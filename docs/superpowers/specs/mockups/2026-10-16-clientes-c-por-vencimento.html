<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes C · Por vencimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="2026-10-16-clientes-base.css">
<style>
.lay{display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px;margin-top:16px;align-items:start}
.rail{position:sticky;top:16px;padding:18px 10px 12px}
.rail h2{font-size:15px;font-weight:700;padding:0 10px 8px}
.rail a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;font-weight:500;color:var(--ink2)}
.rail a:hover{background:#f4f7fd}
.rail a b{font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums}
.rail .hot{color:var(--rose700)}.rail .warm{color:var(--amber700)}
.rail p{padding:10px 10px 4px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--rule);margin-top:6px}

.band{scroll-margin-top:8px}
.band+.band{margin-top:26px}
.bh{position:sticky;top:0;z-index:5;display:flex;align-items:baseline;gap:12px;padding:10px 4px;background:var(--paper)}
.bh h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.bh span{color:var(--muted)}
.tr{display:grid;grid-template-columns:76px minmax(0,1.5fr) minmax(0,1fr) 108px 112px;gap:14px;align-items:center;padding:0 20px 0 12px;min-height:66px;border-bottom:1px solid var(--rule)}
.card .tr:last-child{border-bottom:0}
.tr:hover{background:#f8faff}
.tr:focus-visible{outline-offset:-2px}
.cd{text-align:center;line-height:1}
.cd b{display:block;font-size:30px;font-weight:700;letter-spacing:-.03em}
.cd small{display:block;margin-top:3px;font-size:11.5px;color:var(--muted)}
.cd.hot b{color:var(--rose700)}.cd.warm b{color:var(--amber700)}.cd.old b{color:var(--muted)}
.cd.none b{color:#b8c1d1;font-weight:500}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .sub2{display:flex;gap:10px;font-size:12px;color:var(--muted)}
.who .co{color:var(--blue700);font-weight:500}
.plan{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font-size:14px;font-weight:600;text-align:right}
.mo{display:flex;justify-content:center;padding:12px}
.mo button{border:0;background:none;color:var(--blue700);font-weight:600;cursor:pointer}
@media (max-width:1180px){.lay{grid-template-columns:1fr}.rail{position:static;padding:14px 12px}.rail h2,.rail p{display:none}.rail #rail{display:flex;flex-wrap:wrap;gap:4px}.rail a{gap:10px}}
@media (max-width:760px){.tr{grid-template-columns:64px 1fr;gap:6px 12px;padding:12px 16px}.plan,.val{grid-column:2;text-align:left}}
</style></head><body><div class="wrap">
<header class="head"><div><h1 class="d">Clientes</h1><p class="sub">Agrupados pelo vencimento do contrato, de quem vence primeiro para quem vence depois</p></div>
<div class="ctl"><button class="fp" type="button">Situação <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg></button><button class="fp" type="button">Responsável <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg></button><button class="fp" type="button">Plano <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg></button></div></header>
<div class="lay"><nav class="card rail" aria-label="Quando o contrato vence"><h2 class="d">Quando vence</h2><div id="rail"></div><p>580 clientes no total</p></nav><main id="bands"></main></div></div>
<div class="tag">Mockup C · Por vencimento · dados de exemplo</div>
<script src="2026-10-16-clientes-dados.js"></script>
<script>
const {clients,avatar,pill,brl}=CL;
const $=id=>document.getElementById(id);
const BANDS=[
  {id:'semana',label:'Próximos 7 dias',base:14,tone:'hot'},
  {id:'mes',label:'De 8 a 30 dias',base:49,tone:'warm'},
  {id:'trim',label:'De 31 a 90 dias',base:138},
  {id:'depois',label:'Depois de 90 dias',base:274},
  {id:'vencidos',label:'Já venceram',base:54},
  {id:'fora',label:'Fora de vigência',base:51,note:'trancados, agendados, cancelados e sem contrato'}
];
const bandOf=c=>['trancado','agendado','cancelado','sem'].includes(c.st)?'fora':c.st==='vencido'?'vencidos':c.days<=7?'semana':c.days<=30?'mes':c.days<=90?'trim':'depois';
const cd=c=>{
  if(['trancado','agendado','cancelado','sem'].includes(c.st))return '<div class="cd none"><b class="d">—</b></div>';
  if(c.st==='vencido')return `<div class="cd old"><b class="d num">${-c.days}</b><small>${-c.days===1?'dia atrás':'dias atrás'}</small></div>`;
  if(c.days===0)return '<div class="cd hot"><b class="d">hoje</b></div>';
  return `<div class="cd ${c.days<=7?'hot':c.days<=30?'warm':''}"><b class="d num">${c.days}</b><small>${c.days===1?'dia':'dias'}</small></div>`;
};
const row=c=>`<a class="tr" href="#">${cd(c)}
  <div class="who">${avatar(c,36)}<div style="min-width:0"><b>${c.name}</b><div class="sub2"><span class="num">${c.phone}</span><span class="co">@${c.co}</span></div></div></div>
  <span class="plan">${c.plan||'<span class="mut">—</span>'}</span><span class="val d num">${c.value==null?'<span class="mut">—</span>':brl(c.value)}</span><span>${pill(c.st)}</span></a>`;
$('rail').innerHTML=BANDS.map(b=>`<a href="#b-${b.id}"><span>${b.label}</span><b class="${b.tone||''}">${b.base}</b></a>`).join('');
$('bands').innerHTML=BANDS.map(b=>{
  const list=clients.filter(c=>bandOf(c)===b.id);
  return `<section class="band" id="b-${b.id}"><header class="bh"><h2 class="d">${b.label}</h2><span class="num">${b.base} clientes${b.note?', '+b.note:''}</span></header>
  <div class="card">${list.map(row).join('')}<div class="mo"><button type="button">Mostrar mais (${list.length} de ${b.base})</button></div></div></section>`;
}).join('');
</script></body></html>
