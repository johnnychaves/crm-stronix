<!doctype html>
<html lang="pt-BR" translate="no" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Stronix Pay no SuperConsole</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens: os do Stronilead (os mesmos dos mockups de Rotinas) e a casca do
   SuperConsole (src/views/console/console.css). O console de hoje é só
   escuro; o tema claro fica aqui para conferir contraste.
   Cores das formas de pagamento validadas como paleta categórica (ordem da
   pilha: Cartão, Pix, Pix Automático, Boleto), no claro sobre #FFFFFF e no
   escuro sobre #0F152B. */
:root {
  --bg: #F5F7FB; --card: #FFFFFF; --side: #FFFFFF; --top: rgba(245, 247, 251, .88);
  --ink: #0E1A40; --muted: #64748B; --faint: #94A3B8; --line: #E2E8F0; --line-2: #CBD5E1; --soft: #F1F4F9;
  --brand: #2B59FF; --brand-ink: #1E44D6; --brand-soft: rgba(43, 89, 255, .08);
  --accent: #FF6A2B; --accent-ink: #C2410C;
  --done: #059669; --done-ink: #047857; --done-soft: rgba(5, 150, 105, .1);
  --warn: #B45309; --warn-soft: rgba(245, 158, 11, .14);
  --late: #E11D48; --late-ink: #BE123C; --late-soft: #FFF1F3;
  --s-card: #2B59FF; --s-pix: #0E9A90; --s-pixa: #8B5CF6; --s-bol: #F2541A;
  --grid: #EEF2F7; --axis: #CBD5E1;
  --shadow: 0 1px 0 rgba(15, 23, 42, .04), 0 1px 2px rgba(15, 23, 42, .06);
  --shadow-pop: 0 30px 60px -20px rgba(14, 26, 64, .35), 0 2px 8px rgba(14, 26, 64, .08);
  --scrim: rgba(14, 26, 64, .42);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #080D22; --card: #0F152B; --side: #0B1126; --top: rgba(8, 13, 34, .86);
  --ink: #EAEEF9; --muted: #8A93B0; --faint: #5B6482; --line: rgba(255, 255, 255, .08); --line-2: rgba(255, 255, 255, .16); --soft: rgba(255, 255, 255, .05);
  --brand: #5A7FFF; --brand-ink: #9BB0FF; --brand-soft: rgba(90, 127, 255, .13);
  --accent: #FF6A2B; --accent-ink: #FF9A6B;
  --done: #34D399; --done-ink: #34D399; --done-soft: rgba(52, 211, 153, .12);
  --warn: #FBBF24; --warn-soft: rgba(251, 191, 36, .12);
  --late: #FB7185; --late-ink: #FB7185; --late-soft: rgba(251, 113, 133, .12);
  --s-card: #5A7FFF; --s-pix: #17A89C; --s-pixa: #9474F2; --s-bol: #E8662A;
  --grid: rgba(255, 255, 255, .06); --axis: rgba(255, 255, 255, .16);
  --shadow: none; --shadow-pop: 0 30px 60px -16px rgba(0, 0, 0, .7);
  --scrim: rgba(3, 6, 18, .64);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 Geist, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; text-align: left; }
ul, ol { list-style: none; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.t { font-family: 'Space Grotesk', Geist, sans-serif; font-variant-numeric: tabular-nums; }
svg.i { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- barra do mockup (fora do app) ---------- */
.chrome { position: sticky; top: 0; z-index: 70; background: #0E1A40; color: #fff; border-bottom: 1px solid rgba(255, 255, 255, .08); }
:root[data-theme="dark"] .chrome { background: #0C1432; }
.chrome-in { padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.chrome-name { display: flex; align-items: center; gap: 8px; font: 600 13.5px/1 'Space Grotesk', sans-serif; }
.chrome-name small { font: 600 9.5px/1 Geist, sans-serif; letter-spacing: .09em; text-transform: uppercase; color: #FF8A57; border: 1px solid rgba(255, 138, 87, .45); padding: 4px 6px; border-radius: 5px; }
.tabs { max-width: 100%; overflow-x: auto; overscroll-behavior-x: contain; display: flex; gap: 3px; background: rgba(255, 255, 255, .07); padding: 3px; border-radius: 10px; }
.tab { height: 30px; padding: 0 12px; border-radius: 7px; font-size: 12.5px; font-weight: 500; color: rgba(255, 255, 255, .74); white-space: nowrap; }
.tab[aria-pressed="true"] { background: #fff; color: #0E1A40; }
.theme { margin-left: auto; height: 30px; padding: 0 10px; border: 1px solid rgba(255, 255, 255, .18); border-radius: 8px; font-size: 12px; color: rgba(255, 255, 255, .88); white-space: nowrap; }
.note { padding: 0 16px 11px; font-size: 12.5px; color: rgba(255, 255, 255, .82); max-width: 1000px; }
.note b { color: #fff; font-weight: 600; }
.chrome :focus-visible { outline-color: #9BB0FF; }
@media (max-width: 760px) { .chrome { position: static; } }

/* ---------- casca do console ---------- */
.console { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: var(--ch, 0px); height: calc(100vh - var(--ch, 0px)); align-self: start; }
.side-brand { padding: 18px; display: flex; align-items: center; gap: 11px; border-bottom: 1px solid var(--line); }
.smk { width: 38px; height: 38px; border-radius: 11px; background: #0E1A40; display: grid; place-items: center; flex: none; }
:root[data-theme="dark"] .smk { background: rgba(255, 255, 255, .06); box-shadow: inset 0 0 0 1px var(--line-2); }
.smk svg { width: 23px; height: 23px; }
.sbrand-wm { display: block; font: 700 16px/1.2 'Space Grotesk', sans-serif; letter-spacing: -.02em; }
.sbrand-wm b { color: var(--brand); }
:root[data-theme="dark"] .sbrand-wm b { color: #9FBCFF; }
.sbrand-tag { display: block; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-ink); margin-top: 2px; }
.side-scroll { flex: 1; overflow-y: auto; padding: 14px 12px; }
.nav-group { margin-bottom: 18px; }
.nav-label { font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); padding: 0 10px; margin-bottom: 8px; }
.nav-item { position: relative; display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 10px; border-radius: 10px; color: var(--muted); font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.nav-item:hover { background: var(--soft); color: var(--ink); }
.nav-item.active { background: var(--brand-soft); color: var(--ink); font-weight: 600; }
.nav-item.active::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--brand); }
.nav-item.active svg.i { color: var(--brand); }
.nav-item svg.i { width: 18px; height: 18px; color: var(--faint); }
.side-foot { padding: 12px; border-top: 1px solid var(--line); }
.who { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; background: var(--soft); }
.who-av { width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font: 700 13px/1 'Space Grotesk', sans-serif; flex: none; }
.who-n { font-size: 13px; font-weight: 600; }
.who-r { font-size: 11px; color: var(--muted); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 26px; border-bottom: 1px solid var(--line); background: var(--top); backdrop-filter: blur(10px); position: sticky; top: var(--ch, 0px); z-index: 30; }
.menu { display: none; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); place-items: center; color: var(--muted); }
.crumb { font-size: 13px; color: var(--muted); white-space: nowrap; }
.crumb b { color: var(--ink); font-weight: 600; }
.env-pill { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; color: var(--accent-ink); background: rgba(255, 106, 43, .1); border: 1px solid rgba(255, 106, 43, .28); padding: 6px 11px; border-radius: 99px; white-space: nowrap; }
.env-pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.top-search { margin-left: auto; position: relative; }
.top-search input { width: 280px; height: 38px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px 0 36px; font-size: 13px; outline: none; }
.top-search input:focus-visible { border-color: var(--brand); }
.top-search svg { position: absolute; left: 11px; top: 11px; color: var(--faint); }
.top-ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); border: 1px solid var(--line); background: var(--card); flex: none; }
.view { padding: 26px; max-width: 1320px; width: 100%; margin: 0 auto; }
@media (max-width: 880px) {
  .console { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: 0; height: 100vh; z-index: 90; width: 260px; transform: translateX(-102%); transition: transform .22s ease; box-shadow: var(--shadow-pop); }
  .side.open { transform: none; }
  .menu { display: grid; }
  .top { padding: 0 16px; gap: 10px; }
  .top-search { display: none; }
  .top-ic { margin-left: auto; }
}
@media (max-width: 600px) { .view { padding: 20px 16px 48px; } }

/* ---------- peças ---------- */
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-bottom: 20px; }
.ph h1 { font: 700 25px/1.15 'Space Grotesk', sans-serif; letter-spacing: -.02em; }
.ph p { margin-top: 5px; color: var(--muted); font-size: 14px; }
.ph-r { display: flex; align-items: center; gap: 12px; }
.stamp { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 10px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.btn-ghost { background: var(--card); border: 1px solid var(--line-2); }
.btn-ghost:hover { border-color: var(--brand); }
.btn-pri { background: var(--brand); color: #fff; }
.btn-sm { height: 32px; padding: 0 11px; font-size: 12.5px; border-radius: 9px; }
.linkbtn { color: var(--brand-ink); font-size: 12.5px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--brand) 40%, transparent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 14px; padding: 16px 20px 0; }
.card-h h2 { font: 600 16px/1.25 'Space Grotesk', sans-serif; letter-spacing: -.01em; }
.card-h p { font-size: 12.5px; color: var(--muted); }
.card-b { padding: 16px 20px 20px; }

/* dinheiro: R$ e centavos menores nos números grandes */
.money { font-family: 'Space Grotesk', sans-serif; font-weight: 600; letter-spacing: -.02em; white-space: nowrap; }
.money .cur { font-size: .5em; font-weight: 500; color: var(--muted); margin-right: .22em; letter-spacing: 0; }
.money .cents { font-size: .55em; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.money.bad { color: var(--late-ink); }
.money.bad .cur, .money.bad .cents { color: inherit; opacity: .75; }

.fig-l { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.fig-v { display: block; margin-top: 6px; font-size: 24px; line-height: 1.1; }
.fig-s { margin-top: 6px; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.fig-s b { color: var(--ink); font-weight: 600; }
.meter { margin-top: 10px; height: 4px; border-radius: 4px; background: var(--grid); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--done); border-radius: 4px; }

/* forma de pagamento: o mesmo quadradinho da legenda do gráfico */
.fm { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.sw.link { background: transparent; border: 1.5px solid var(--faint); }
.fm.link { color: var(--muted); }

/* situação: texto e sinal, cor só como terceiro reforço */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px 4px 6px; border-radius: 7px; font-size: 12px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
.badge svg.i { width: 13px; height: 13px; stroke-width: 2.2; }
.b-pago, .b-ok { background: var(--done-soft); color: var(--done-ink); }
.b-pendente, .b-proc { background: var(--brand-soft); color: var(--brand-ink); }
.b-vencido, .b-recusado, .b-fail { background: var(--late-soft); color: var(--late-ink); }
.b-reprovado, .b-contestado { background: var(--warn-soft); color: var(--warn); }
.b-estornado, .b-skip { background: var(--soft); color: var(--muted); }
.b-estornado, .b-skip { box-shadow: inset 0 0 0 1px var(--line-2); }
.rec { display: inline-block; margin-left: 6px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }

/* filtros */
.filters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.fl { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; min-width: 0; }
.fl select { height: 36px; width: 100%; min-width: 0; border: 1px solid var(--line-2); border-radius: 9px; background: var(--card); padding: 0 8px; font-size: 13px; color: var(--ink); }
.fl select.on { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.result { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
.result b { color: var(--ink); font-weight: 600; }
@media (max-width: 720px) { .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* tabelas */
.tscroll { overflow-x: auto; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--line); font-size: 13.5px; vertical-align: middle; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl .num { font-family: 'Space Grotesk', sans-serif; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl .r { text-align: right; }
.tbl th:first-child, .tbl td:first-child { padding-left: 20px; }
.tbl th:last-child, .tbl td:last-child { padding-right: 20px; }
.tx tbody tr[data-id] { cursor: pointer; }
.tx tbody tr[data-id]:hover td { background: var(--soft); }
.tx tbody tr.on td { background: var(--brand-soft); }
.tx tbody tr.on td:first-child { box-shadow: inset 3px 0 0 var(--brand); }
.rowbtn { font-weight: 600; font-size: 13.5px; text-align: left; white-space: nowrap; }
.rowbtn:hover { color: var(--brand-ink); }
.muted { color: var(--muted); }
.sub { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.empty { padding: 28px 20px; text-align: center; color: var(--muted); font-size: 13.5px; }
.empty .linkbtn { margin-left: 4px; }

/* gráfico de colunas (A) */
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend b { color: var(--ink); font-weight: 600; font-family: 'Space Grotesk', sans-serif; font-variant-numeric: tabular-nums; }
.cols { display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 8px; margin-top: 18px; }
.cols-y { position: relative; height: 210px; }
.cols-y span { position: absolute; right: 0; transform: translateY(50%); font: 500 11px/1 'Space Grotesk', sans-serif; color: var(--muted); font-variant-numeric: tabular-nums; }
.cols-plot { position: relative; height: 210px; display: flex; border-bottom: 1px solid var(--axis); }
.gl { position: absolute; left: 0; right: 0; height: 1px; background: var(--grid); pointer-events: none; }
.col { position: relative; flex: 1; height: 100%; display: flex; justify-content: center; align-items: flex-end; border-radius: 8px 8px 0 0; text-align: center; }
.col:hover, .col:focus-visible { background: var(--soft); }
.stack { position: relative; width: 30px; display: flex; flex-direction: column-reverse; gap: 2px; border-radius: 4px 4px 0 0; overflow: hidden; }
.stack i { display: block; min-height: 2px; }
.col .tot { position: absolute; left: 0; right: 0; font: 600 12px/1 'Space Grotesk', sans-serif; font-variant-numeric: tabular-nums; color: var(--ink); }
.cols-x { grid-column: 2; display: flex; margin-top: 8px; }
.cols-x span { flex: 1; text-align: center; font-size: 12px; color: var(--muted); line-height: 1.25; }
.cols-x small { display: block; font-size: 11px; }
.tview { margin-top: 14px; font-size: 12.5px; }
.tview summary { cursor: pointer; color: var(--brand-ink); font-weight: 600; width: max-content; border-radius: 6px; }
.tview .tscroll { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; }
.tview .tbl td, .tview .tbl th { padding: 8px 12px; font-size: 12.5px; }
.tview .tbl th:first-child, .tview .tbl td:first-child { padding-left: 12px; }

/* tooltip dos gráficos */
.tip { position: fixed; z-index: 120; pointer-events: none; min-width: 200px; background: var(--card); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow-pop); padding: 10px 12px; font-size: 12.5px; }
.tip[hidden] { display: none; }
.tip h4 { font: 600 13px/1.2 'Space Grotesk', sans-serif; margin-bottom: 6px; }
.tip p { display: flex; align-items: center; gap: 7px; padding: 2px 0; color: var(--muted); }
.tip p b { margin-left: auto; padding-left: 14px; color: var(--ink); font: 600 12.5px/1.2 'Space Grotesk', sans-serif; font-variant-numeric: tabular-nums; }
.tip p.tt { border-top: 1px solid var(--line); margin-top: 5px; padding-top: 6px; color: var(--ink); font-weight: 600; }

/* régua */
.rg-sum { font-size: 14px; line-height: 1.5; }
.rg-sum b { font-family: 'Space Grotesk', sans-serif; font-weight: 600; }
.rg-sum .bad { color: var(--late-ink); }
.rg-next { margin-top: 2px; font-size: 12.5px; color: var(--muted); }
.rg-tbl { margin-top: 12px; }
.rg-tbl th, .rg-tbl td { padding: 8px 10px; font-size: 13px; }
.rg-tbl th:first-child, .rg-tbl td:first-child { padding-left: 0; }
.rg-tbl th:last-child, .rg-tbl td:last-child { padding-right: 0; }
.rg-tbl td.num { font-size: 14px; font-weight: 600; }
.rg-tbl td.num.zero { color: var(--faint); font-weight: 500; }
.rg-tbl .x { display: block; font: 600 11.5px/1.3 Geist, sans-serif; color: var(--late-ink); }
.rg-tbl .x.skip { color: var(--muted); font-weight: 500; }
.rg-h { display: flex; align-items: center; gap: 6px; }
.rg-sec { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.rg-sec h3 { font: 600 13.5px/1.3 'Space Grotesk', sans-serif; }
.rg-item { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: 13px; }
.rg-item p { min-width: 0; }
.rg-item b { font-weight: 600; }
.rg-item .sub { font-size: 12px; }
.rg-item .sub.bad { color: var(--late-ink); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; white-space: nowrap; padding: 2px; border-radius: 99px; }
.sw-track { width: 36px; height: 20px; border-radius: 99px; background: var(--line-2); position: relative; flex: none; transition: background .15s; }
.sw-track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: left .15s; }
.switch[aria-checked="true"] .sw-track { background: var(--warn); }
.switch[aria-checked="true"] .sw-track::after { left: 18px; }

/* detalhe da cobrança */
.dt-h h2 { font: 600 20px/1.2 'Space Grotesk', sans-serif; letter-spacing: -.01em; }
.dt-h .desc { margin-top: 3px; color: var(--muted); font-size: 13.5px; }
.dt-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.dt-close { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); flex: none; }
.dt-close:hover { color: var(--ink); }
.dt-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 18px; margin-top: 16px; }
.dt-meta dt { font-size: 12px; color: var(--muted); }
.dt-meta dd { margin-top: 2px; font-size: 13.5px; font-weight: 500; }

// ---------------- formatos ----------------
const brl = (v) => 'R$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const short = (v) => v.toLocaleString('pt-BR', { maximumFractionDigits: 0 });
function big(v, bad) {
  const [i, c] = v.toFixed(2).split('.');
  return `<span class="money${bad ? ' bad' : ''}"><span class="cur">R$</span>${Number(i).toLocaleString('pt-BR')}<span class="cents">,${c}</span></span>`;
}
const dm = (iso) => `${iso.slice(8, 10)}/${iso.slice(5, 7)}`;
const dmy = (iso) => `${dm(iso)}/${iso.slice(0, 4)}`;
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
const sum = (arr) => arr.reduce((s, t) => s + t.v, 0);
const total = (m) => SERIES.reduce((s, k) => s + m[k], 0);
const badge = (k) => `<span class="badge b-${k}">${ic(SIT[k].ic)}${SIT[k].n}</span>`;
const resBadge = (k) => `<span class="badge b-${k}">${ic(RES[k].ic)}${RES[k].n}</span>`;
function forma(t) {
  const f = FORMAS[t.f];
  return f.c ? `<span class="fm"><span class="sw" style="background:${f.c}"></span>${f.n}</span>` : `<span class="fm link"><span class="sw link"></span>${f.n}</span>`;
}
function invoiceUrl(t) {
  let h = 7; for (const ch of t.id + t.g) h = (h * 131 + ch.charCodeAt(0)) >>> 0;
  let s = ''; for (let i = 0; i < 12; i++) { s += 'abcdefghjkmnpqrstuvwxyz23456789'[h % 31]; h = (h * 1103515245 + 12345) >>> 0; }
  return `https://www.asaas.com/i/${s}`;
}
function eventsOf(t) {
  if (t.ev) return t.ev;
  const due = new Date(t.due + 'T12:00:00');
  const c = new Date(due); c.setDate(c.getDate() - 10);
  const created = `${String(c.getDate()).padStart(2, '0')}/${String(c.getMonth() + 1).padStart(2, '0')}, 00:14`;
  const ev = [[created, 'Cobrança criada']];
  if (t.st === 'pago') {
    const how = { card: `Pago no cartão ${GYMS[t.g].card || ''}`.trim(), pix: 'Pago no Pix', pixa: 'Debitado no Pix Automático', bol: 'Boleto pago' }[t.f];
    ev.push([t.paid, how, 'ok']);
    if (t.f === 'bol') ev.push([t.paid.replace(/, .*/, ', 23:40'), 'Pagamento compensado na conta', 'ok']);
  }
  return ev;
}

// régua
function reguaStats() {
  const rows = {}; Object.keys(ETAPAS).forEach((k) => { rows[k] = { wa: { ok: 0, fail: 0, skip: 0 }, mail: { ok: 0, fail: 0, skip: 0 } }; });
  let ok = 0, fail = 0, skip = 0; const fails = [];
  TX.forEach((t) => (t.rem || []).forEach(([e, c, r, at, why]) => {
    if (at.slice(3, 5) !== '10') return;
    rows[e][c][r]++;
    if (r === 'ok') ok++; else if (r === 'fail') { fail++; fails.push({ t, e, c, at, why }); } else skip++;
  }));
  return { rows, ok, fail, skip, fails };
}
function reguaCell(x) {
  const extra = [x.fail ? `<span class="x">${x.fail} falhou</span>` : '', x.skip ? `<span class="x skip">${plural(x.skip, 'pulado', 'pulados')}</span>` : ''].join('');
  return `<td class="num r${x.ok ? '' : ' zero'}">${x.ok}${extra}</td>`;
}
function reguaHtml(split) {
  const s = reguaStats();
  const noContact = Object.entries(GYMS).filter(([, g]) => g.noWa || g.noMail);
  const paused = Object.entries(GYMS).filter(([, g]) => g.pausedAt);

    <div class="rg-sec"><h3>Academias sem contato</h3>${noContact.map(([, g]) => `<div class="rg-item"><p><b>${g.n}</b><span class="sub">${g.noWa ? 'Sem WhatsApp no Perfil. Só o e-mail sai.' : 'Sem e-mail. Só o WhatsApp sai.'}</span></p></div>`).join('')}</div>
    <div class="rg-sec"><h3>Régua pausada</h3>${paused.map(([id, g]) => {
      const on = !!S.paused[id];
      const msg = on ? `Pausada em ${g.pausedAt}. Nenhum aviso sai para essa academia.` : (S.toggled[id] ? 'Ligada de novo. Os avisos voltam na rodada de amanhã, às 9h.' : '');

    }).join('')}</div>`;

  return `${summary}${matrix}${lists}`;

let lastFocus = null;
function focusKey(el) {
  if (!el || el === document.body) return null;
  if (el.dataset.f) return `[data-f="${el.dataset.f}"]`;
  if (el.dataset.act) return `[data-act="${el.dataset.act}"]${el.dataset.id ? `[data-id="${el.dataset.id}"]` : ''}${el.dataset.tab ? `[data-tab="${el.dataset.tab}"]` : ''}${el.dataset.gym ? `[data-gym="${el.dataset.gym}"]` : ''}`;
  return null;
}
function render(keepFocus = true) {
  const key = keepFocus ? focusKey(document.activeElement) : null;
  const view = document.getElementById('view');
  view.innerHTML = S.opt === 'a' ? optA() : S.opt === 'b' ? optB() : optC();
  const t = TX.find((x) => x.id === S.open);
  const ov = document.getElementById('overlay');
  if (t && S.opt !== 'b') {
    ov.innerHTML = S.opt === 'a'
      ? `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dt-title">${detailBody(t, 'drawer')}</aside>`
      : `<div class="scrim" data-act="close"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dt-title">${detailBody(t, 'modal')}</div>`;
    document.body.style.overflow = 'hidden';
  } else { ov.innerHTML = ''; document.body.style.overflow = ''; }
  document.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.opt === S.opt)));
  document.getElementById('note').innerHTML = NOTES[S.opt];
  sizeChrome(); sizeInline();
  if (key) { const el = document.querySelector(key); if (el) el.focus({ preventScroll: true }); }
}
function sizeChrome() {
  const c = document.querySelector('.chrome');
  const fixed = getComputedStyle(c).position === 'sticky';
  document.documentElement.style.setProperty('--ch', fixed ? `${c.offsetHeight}px` : '0px');
}
function sizeInline() {
  document.querySelectorAll('[data-tw]').forEach((el) => el.style.setProperty('--tw', `${el.clientWidth}px`));
}
window.addEventListener('resize', () => { sizeChrome(); sizeInline(); });

function applyTheme() {
  document.documentElement.dataset.theme = S.theme;
  document.getElementById('theme').textContent = S.theme === 'dark' ? 'Tema claro' : 'Tema escuro';
}
function writeHash() { history.replaceState(null, '', `#${S.opt}-${S.theme}`); }
function readHash() {
  const p = location.hash.replace('#', '').split('-');
  if (['a', 'b', 'c'].includes(p[0])) S.opt = p[0];
  if (['light', 'dark'].includes(p[1])) S.theme = p[1];
  const x = p[2];
  S.open = null;
  if (x && x.startsWith('detalhe')) {
    S.open = { detalhe: 't05', detalhe2: 't04', detalhe3: 't07' }[x] || 't05';
    if (S.opt === 'b') S.tab = 'transacoes';
  } else if (B_TABS.some(([k]) => k === x)) S.tab = x;
  if (x === 'atraso') { S.f.sit = 'vencido'; S.tab = 'transacoes'; }
}

function openDetail(id) {
  lastFocus = id;
  S.open = S.open === id && S.opt === 'b' ? null : id;
  render(false);
  if (S.opt === 'b') { const el = document.querySelector(`[data-act="open"][data-id="${id}"]`); if (el) el.focus(); }
  else { const h = document.getElementById('dt-title'); if (h) h.focus(); }
}
function closeDetail() {
  S.open = null; render(false);
  if (lastFocus) { const el = document.querySelector(`#view [data-act="open"][data-id="${lastFocus}"]`); if (el) el.focus({ preventScroll: true }); }
}
async function copyText(txt, btn) {
  // Primeiro o jeito direto (funciona em file://); se falhar, a API da área
  // de transferência, com limite de tempo para o botão nunca ficar parado.
  const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove(); if (btn) btn.focus({ preventScroll: true });
  if (ok) return true;
  try { await Promise.race([navigator.clipboard.writeText(txt), new Promise((_, no) => setTimeout(() => no(new Error('tempo')), 1200))]); return true; } catch (e) { return false; }
}
const smooth = () => (matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth');

document.addEventListener('click', async (e) => {
  const opt = e.target.closest('.tab[data-opt]');
  if (opt) { S.opt = opt.dataset.opt; S.open = null; writeHash(); render(false); return; }
  if (e.target.closest('#theme')) { S.theme = S.theme === 'dark' ? 'light' : 'dark'; applyTheme(); writeHash(); return; }
  if (e.target.closest('#menu')) { const side = document.getElementById('side'); const open = !side.classList.contains('open'); side.classList.toggle('open', open); e.target.closest('#menu').setAttribute('aria-expanded', String(open)); return; }
  const a = e.target.closest('[data-act]');
  if (!a) {
    const tr = e.target.closest('tr[data-id]');
    if (tr) openDetail(tr.dataset.id);
    return;
  }
  const act = a.dataset.act;
  if (act === 'noop') { e.preventDefault(); return; }
  if (act === 'open') { openDetail(a.dataset.id); return; }
  if (act === 'close') { closeDetail(); return; }
  if (act === 'tab') { S.tab = a.dataset.tab; render(false); document.getElementById(`tab-${S.tab}`).focus(); return; }
  if (act === 'clear') { S.f = { sit: '', forma: '', gym: '', per: '90' }; render(false); const f = document.querySelector('[data-f="sit"]'); if (f) f.focus(); return; }
  if (act === 'late') {
    S.f = { sit: 'vencido', forma: '', gym: '', per: '90' }; S.open = null;
    if (S.opt === 'b') S.tab = 'transacoes';
    render(false);
    const sec = document.getElementById('transacoes');
    if (sec) { sec.scrollIntoView({ behavior: smooth(), block: 'start' }); document.querySelector('[data-f="sit"]').focus({ preventScroll: true }); }
    return;
  }
  if (act === 'pause') { const g = a.dataset.gym; S.paused[g] = !S.paused[g]; S.toggled[g] = true; render(); return; }
  if (act === 'more') { S.cAll = true; render(false); const el = document.querySelectorAll('.c-list [data-act="open"]')[10]; if (el) el.focus(); return; }
  if (act === 'refresh') { S.updated = '10:43'; render(); return; }
  if (act === 'copy') {
    const ok = await copyText(a.dataset.url, a);
    a.classList.toggle('done', ok);
    a.innerHTML = ok ? `${ic('check')}<span>Copiado</span>` : `<span>Use Ctrl+C</span>`;
    a.setAttribute('aria-live', 'polite');
    clearTimeout(a._t); a._t = setTimeout(() => { a.classList.remove('done'); a.innerHTML = `${ic('copy')}<span>Copiar</span>`; }, 2000);
    if (!ok) { const code = a.parentElement.querySelector('code'); const r = document.createRange(); r.selectNodeContents(code); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
  }
});
document.addEventListener('change', (e) => {
  const s = e.target.closest('select[data-f]');
  if (!s) return;
  S.f[s.dataset.f] = s.value; S.open = null; render();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (S.open && S.opt !== 'b') { closeDetail(); return; }
    const side = document.getElementById('side'); if (side.classList.contains('open')) { side.classList.remove('open'); document.getElementById('menu').setAttribute('aria-expanded', 'false'); }
  }
  const tab = e.target.closest('[role="tab"]');
  if (tab && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    const i = B_TABS.findIndex(([k]) => k === S.tab);
    const n = (i + (e.key === 'ArrowRight' ? 1 : B_TABS.length - 1)) % B_TABS.length;
    S.tab = B_TABS[n][0]; render(false); document.getElementById(`tab-${S.tab}`).focus(); e.preventDefault();
  }
  if (e.key === 'Tab' && S.open && S.opt !== 'b') {
    const box = document.querySelector('.drawer, .modal'); if (!box) return;
    const f = [...box.querySelectorAll('button, a[href], [tabindex="0"]')];
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { f[f.length - 1].focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { f[0].focus(); e.preventDefault(); }
  }
});

// tooltip dos gráficos
const tip = document.getElementById('tip');
function showTip(el) {
  const html = TIPS[el.dataset.tip]; if (!html) return;
  tip.innerHTML = html; tip.hidden = false;
  const r = el.getBoundingClientRect(); const w = tip.offsetWidth; const h = tip.offsetHeight;
  let x = r.left + r.width / 2 - w / 2; x = Math.max(8, Math.min(x, innerWidth - w - 8));
  let y = r.top - h - 8; if (y < 60) y = r.bottom + 8;
  tip.style.left = `${x}px`; tip.style.top = `${y}px`;
}
const hideTip = () => { tip.hidden = true; };
document.addEventListener('mouseover', (e) => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); else hideTip(); });
document.addEventListener('focusin', (e) => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); else hideTip(); });
document.addEventListener('scroll', hideTip, true);

window.addEventListener('hashchange', () => { readHash(); applyTheme(); render(false); });
readHash(); applyTheme(); render(false);
</script>
