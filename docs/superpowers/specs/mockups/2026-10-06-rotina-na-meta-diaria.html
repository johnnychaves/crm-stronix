<!doctype html>
<html lang="pt-BR" translate="no" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Rotina na Meta diária</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tokens: os do Stronilead (src/index.css), mais os estados da rotina. */
:root {
  --bg: #F5F7FB;
  --card: #FFFFFF;
  --card-solid: #FFFFFF;
  --ink: #0E1A40;
  --muted: #64748B;
  --line: #E2E8F0;
  --line-strong: #CBD5E1;
  --soft: #F1F4F9;
  --brand: #2B59FF;
  --brand-ink: #1E44D6;
  --brand-soft: rgba(43, 89, 255, .08);
  --accent: #FF6A2B;
  --accent-soft: rgba(255, 106, 43, .14);
  --done: #059669;
  --warn: #B45309;
  --late: #E11D48;
  --late-solid: #FFF1F3;
  --shadow: 0 1px 0 rgba(15, 23, 42, .04), 0 1px 2px rgba(15, 23, 42, .06);
  --tcol: 44px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #080D22;
  --card: rgba(255, 255, 255, .025);
  --card-solid: #0F152B;
  --ink: #EAEEF9;
  --muted: #8A93B0;
  --line: rgba(255, 255, 255, .07);
  --line-strong: rgba(255, 255, 255, .2);
  --soft: rgba(255, 255, 255, .05);
  --brand: #5A7FFF;
  --brand-ink: #9BB0FF;
  --brand-soft: rgba(90, 127, 255, .13);
  --accent-soft: rgba(255, 106, 43, .16);
  --done: #34D399;
  --warn: #FBBF24;
  --late: #FB7185;
  --late-solid: #2A1326;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 Geist, ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
ol, ul { list-style: none; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.t { font-family: 'Space Grotesk', Geist, sans-serif; font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
svg.i { width: 14px; height: 14px; flex-shrink: 0; }

/* ---------- Barra do mockup (fora do app) ---------- */
.chrome { position: sticky; top: 0; z-index: 30; background: #0E1A40; color: #fff; border-bottom: 1px solid rgba(255, 255, 255, .08); }
:root[data-theme="dark"] .chrome { background: #0C1432; }
.chrome-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.chrome-name { display: flex; align-items: center; gap: 8px; font: 600 13.5px/1 'Space Grotesk', sans-serif; letter-spacing: -.01em; }
.chrome-name small { font: 600 9.5px/1 Geist, sans-serif; letter-spacing: .09em; text-transform: uppercase; color: #FF8A57; border: 1px solid rgba(255, 138, 87, .45); padding: 4px 6px; border-radius: 5px; }
.tabs { max-width: 100%; overflow-x: auto; overscroll-behavior-x: contain; display: flex; gap: 3px; background: rgba(255, 255, 255, .07); padding: 3px; border-radius: 10px; }
.tab { height: 30px; padding: 0 12px; border-radius: 7px; font-size: 12.5px; font-weight: 500; color: rgba(255, 255, 255, .72); white-space: nowrap; }
.tab:hover { color: #fff; }
.tab[aria-selected="true"] { background: #fff; color: #0E1A40; }
.clock { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 12px; color: rgba(255, 255, 255, .72); }
.clock input { width: 190px; accent-color: #5A7FFF; }
.clock output { font: 600 16px/1 'Space Grotesk', sans-serif; color: #fff; min-width: 46px; }
.theme { height: 30px; padding: 0 10px; border: 1px solid rgba(255, 255, 255, .16); border-radius: 8px; font-size: 12px; color: rgba(255, 255, 255, .85); display: inline-flex; align-items: center; gap: 6px; }
@media (max-width: 760px) { .chrome { position: static; } .clock { margin-left: 0; width: 100%; } .clock input { flex: 1; width: auto; } }

.intro { max-width: 1240px; margin: 0 auto; padding: 22px 16px 4px; }
.intro h1 { font: 600 24px/1.15 'Space Grotesk', sans-serif; letter-spacing: -.02em; }
.intro p { margin-top: 6px; max-width: 780px; color: var(--muted); font-size: 13.5px; }
.verdict { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 28px; margin-top: 14px; font-size: 12.5px; color: var(--muted); max-width: 1000px; }
.verdict b { color: var(--ink); font-weight: 600; }
@media (max-width: 760px) { .verdict { grid-template-columns: 1fr; } }

/* ---------- Casca da Meta diária ---------- */
.screen { max-width: 1240px; margin: 0 auto; padding: 18px 16px 56px; display: flex; flex-direction: column; gap: 24px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.layout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.side { display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 1023px) { .layout { grid-template-columns: 1fr; } }

.eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 7px; }

.hero { padding: 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 24px 32px; }
.hero h2 { margin-top: 6px; max-width: 560px; font: 600 25px/1.18 'Space Grotesk', sans-serif; letter-spacing: -.02em; }
.hero h2 em { font-style: normal; color: var(--brand); }
.hero p { margin-top: 8px; max-width: 520px; color: var(--muted); font-size: 13.5px; }
.score { display: flex; align-items: center; gap: 20px; }
.score-n { text-align: right; }
.score-n .big { font: 600 44px/1 'Space Grotesk', sans-serif; letter-spacing: -.03em; margin-top: 4px; }
.score-n .big span { font-size: 22px; color: var(--muted); }
.score-n small { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
.dial { width: 92px; height: 92px; }
.catbar { flex-basis: 100%; height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; display: flex; gap: 2px; }

.todo-head { padding: 18px 20px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
.todo-head h2 { font-size: 15px; font-weight: 600; }
.count { font: 600 11.5px/20px 'Space Grotesk', sans-serif; padding: 0 6px; border-radius: 6px; background: var(--soft); color: var(--muted); }
.chips { padding: 12px 20px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { height: 32px; padding: 0 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--card-solid); font-size: 12.5px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.chip .n { font: 600 11px/18px 'Space Grotesk', sans-serif; padding: 0 5px; min-width: 18px; text-align: center; border-radius: 5px; background: var(--soft); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip[aria-pressed="true"] .n { background: rgba(255, 255, 255, .16); color: inherit; }
.chip--rotina { color: var(--brand); border-color: color-mix(in srgb, var(--brand) 35%, var(--line)); }
.chip--rotina[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
.chip-alert { width: 8px; height: 8px; border-radius: 50%; background: var(--late); box-shadow: 0 0 0 2px var(--card-solid); }
.dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.sep { width: 1px; height: 20px; background: var(--line); margin: 0 3px; }

.todo-body { padding: 20px; display: flex; flex-direction: column; gap: 26px; }
.sec-head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; font-size: 13px; font-weight: 600; }
.sec-head .t { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.sec-head .rule { flex: 1; height: 1px; background: var(--line); }
.lead { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; background: var(--card-solid); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--muted); font-size: 12px; font-weight: 600; flex-shrink: 0; }
.lead-name { font-size: 13.5px; font-weight: 600; }
.lead-phone { font-size: 12px; color: var(--muted); }
.lead .grow { flex: 1; min-width: 0; }
.tag { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.btn-ink { height: 32px; padding: 0 12px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 500; white-space: nowrap; }
@media (max-width: 560px) { .lead .tag { display: none; } }

.side-card { padding: 16px; }
.side-card h3 { font-size: 13.5px; font-weight: 600; }
.next { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.next .avatar { width: 40px; height: 40px; }
.badge { font: 600 11.5px/1 'Space Grotesk', sans-serif; padding: 6px 9px; border-radius: 8px; background: rgba(139, 92, 246, .12); color: #7C3AED; white-space: nowrap; }
:root[data-theme="dark"] .badge { color: #C4B5FD; }
.ag-head { display: flex; align-items: center; gap: 9px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.ag-ico { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex-shrink: 0; }
.ag-head p, .rt-head p { font-size: 11px; color: var(--muted); }
.ag-row { display: flex; gap: 10px; padding: 7px 16px; font-size: 12.5px; }
.ag-row .t { color: var(--muted); width: 40px; }
.ag-row span:last-child { color: var(--muted); font-size: 11.5px; }
.ag-list { padding: 6px 0 8px; }
.streak { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; margin-top: 12px; }
.streak i { height: 20px; border-radius: 3px; background: var(--soft); }
.streak i.hit { background: rgba(16, 185, 129, .8); }
.streak i.today { background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--brand); }

/* ---------- A rotina ---------- */
.rt-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.rt-ico { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); flex-shrink: 0; }
.rt-head h3 { font-size: 13.5px; font-weight: 600; }
.rt-count { margin-left: auto; text-align: right; flex-shrink: 0; }
.rt-count .t { font-size: 12px; color: var(--muted); }
.rt-count .t b { font-size: 17px; color: var(--ink); font-weight: 600; }
.segs { display: flex; gap: 3px; margin-top: 5px; justify-content: flex-end; }
.seg { width: 10px; height: 4px; border-radius: 2px; background: var(--line-strong); }
.seg.done, .seg.doneLate { background: var(--done); }
.seg.late { background: var(--late); }
.seg.now { background: var(--brand); }

.rt-list { padding: 8px 10px; position: relative; }
/* o trilho do dia, atrás dos círculos */
.rt-list:not(.rt-list--free)::before {
  content: ""; position: absolute; top: 24px; bottom: 24px; width: 2px; border-radius: 2px; background: var(--line);
  left: calc(10px + 8px + var(--tcol) + 10px + 10px);
}
.rt-row { display: grid; grid-template-columns: var(--tcol) 22px minmax(0, 1fr); column-gap: 10px; align-items: start; padding: 8px; border-radius: 12px; position: relative; }
.rt-row.is-now { background: var(--brand-soft); }
.rt-time { font: 600 12.5px/22px 'Space Grotesk', sans-serif; color: var(--muted); text-align: right; display: flex; justify-content: flex-end; align-items: center; height: 22px; }
.is-now .rt-time { color: var(--brand); }
.is-late .rt-time { color: var(--late); }
.rt-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--card-solid); display: grid; place-items: center; position: relative; z-index: 1; color: #fff; transition: border-color .15s, transform .15s; }
.rt-check:hover { border-color: var(--brand); }
.rt-check svg.i { width: 12px; height: 12px; }
.is-done .rt-check, .is-doneLate .rt-check { background: var(--done); border-color: var(--done); }
.is-late .rt-check { border-color: var(--late); background: var(--late-solid); }
.is-now .rt-check { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); animation: breathe 2.4s ease-in-out infinite; }
.rt-check.just { animation: pop .28s ease-out; }
.rt-title { font-size: 13px; font-weight: 500; line-height: 1.35; }
.is-done .rt-title, .is-doneLate .rt-title { color: var(--muted); }
.rt-meta { font-size: 11.5px; margin-top: 2px; color: var(--muted); }
.is-done .rt-meta { color: var(--done); }
.is-doneLate .rt-meta { color: var(--warn); }
.is-late .rt-meta { color: var(--late); }
.is-now .rt-meta { color: var(--brand-ink); font-weight: 500; }
.rt-note { margin-top: 6px; display: inline-flex; align-items: flex-start; gap: 6px; font-size: 11.5px; background: var(--soft); border-radius: 7px; padding: 5px 8px; }
.rt-note svg.i { width: 12px; height: 12px; margin-top: 2px; color: var(--muted); }
.rt-edit { margin-top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rt-edit input { flex: 1; min-width: 140px; height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; background: var(--card-solid); font-size: 12.5px; }
.rt-edit input::placeholder { color: var(--muted); }
.rt-link { font-size: 11.5px; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; padding: 0 4px; }

/* a linha do agora */
.rt-needle { display: grid; grid-template-columns: var(--tcol) minmax(0, 1fr); column-gap: 10px; align-items: center; padding: 3px 8px; position: relative; z-index: 2; }
.rt-needle-tag { font: 600 11px/1 'Space Grotesk', sans-serif; background: var(--brand); color: #fff; border-radius: 5px; padding: 4px 0; text-align: center; }
.rt-needle-bar { height: 2px; background: var(--brand); border-radius: 2px; position: relative; }
.rt-needle-bar::before { content: ""; position: absolute; left: 7px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
.rt-needle-bar::after { content: "agora"; position: absolute; right: 0; top: -15px; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); }

.rt-free { margin: 0 10px; padding: 8px 0 6px; border-top: 1px dashed var(--line); }
.rt-free-label { padding: 2px 18px 0; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.rt-free .rt-list { padding: 4px 0; }
.rt-time svg.i { width: 13px; height: 13px; }

.rt--wide .rt-row { padding: 10px 10px; }
.rt--wide .rt-title { font-size: 13.5px; }

/* ---------- B: faixa do dia ---------- */
.strip { padding: 22px 22px 6px; overflow-x: auto; overscroll-behavior-x: contain; }
.strip-track { position: relative; height: 104px; min-width: 760px; margin: 0 14px; }
.strip-line, .strip-past { position: absolute; left: 0; top: 54px; height: 2px; border-radius: 2px; }
.strip-line { right: 0; background: var(--line); }
.strip-past { background: var(--brand); opacity: .4; }
.strip-hour { position: absolute; top: 84px; transform: translateX(-50%); font-size: 10.5px; color: var(--muted); }
.strip-node { position: absolute; top: 44px; z-index: 3; transform: translateX(-50%); display: flex; justify-content: center; }
.strip-time { position: absolute; bottom: calc(100% + 5px); padding: 2px 3px; border-radius: 4px; background: var(--card-solid); font: 600 11px/1 'Space Grotesk', sans-serif; color: var(--muted); white-space: nowrap; }
.strip-node.is-now .strip-time { color: var(--brand); }
.strip-node.is-late .strip-time { color: var(--late); }
.tip { position: absolute; top: calc(100% + 8px); z-index: 5; white-space: nowrap; background: var(--ink); color: var(--bg); font-size: 11.5px; padding: 5px 8px; border-radius: 7px; opacity: 0; pointer-events: none; transition: opacity .12s; }
.strip-node:hover .tip, .strip-node:focus-within .tip { opacity: 1; }
.strip-needle { position: absolute; top: 16px; bottom: 26px; width: 2px; background: var(--brand); transform: translateX(-1px); z-index: 2; pointer-events: none; }
.strip-needle span { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font: 600 10.5px/1 'Space Grotesk', sans-serif; background: var(--brand); color: #fff; padding: 3px 5px; border-radius: 4px; }
.strip-foot { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); border-top: 1px solid var(--line); }
.strip-foot > div + div { border-left: 1px solid var(--line); }
.strip-foot .rt-free-label { padding: 12px 18px 0; }
.strip-foot .rt-list { padding: 4px 10px 10px; }
.strip-empty { padding: 10px 18px 14px; font-size: 12.5px; color: var(--muted); }
@media (max-width: 760px) { .strip-foot { grid-template-columns: 1fr; } .strip-foot > div + div { border-left: 0; border-top: 1px solid var(--line); } }

@keyframes breathe { 0%, 100% { box-shadow: 0 0 0 4px var(--brand-soft); } 50% { box-shadow: 0 0 0 7px var(--brand-soft); } }
@keyframes pop { 0% { transform: scale(.7); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="chrome">
  <div class="chrome-in">
    <div class="chrome-name"><small>Mockup</small>Rotina na Meta diária</div>
    <div class="tabs" role="tablist" aria-label="Opções" id="tabs"></div>
    <label class="clock">Hora simulada
      <input type="range" id="clock" min="420" max="1260" step="5" value="665" aria-describedby="clock-out">
      <output id="clock-out" class="t">11:05</output>
    </label>
    <button class="theme" id="theme" type="button"></button>
  </div>
</div>

<div class="intro">
  <h1 id="v-title"></h1>
  <p>Arraste a hora simulada para ver o dia andar e toque nos círculos para marcar as tarefas. A rotina tem a contagem dela e não muda os 63% da Meta.</p>
  <div class="verdict" id="verdict"></div>
</div>

<main class="screen" id="screen"></main>

<script>
const ICON = {
  check: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  list: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>',
  repeat: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>',
  note: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>',
  target: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>',
  cal: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  flame: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>',
  moon: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>',
  sun: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
};

// Em minutos desde a meia-noite. A tarefa com horário fica "agora" do horário
// até 30 minutos depois (TOL), e atrasada a partir daí.
const TOL = 30, START = 7 * 60, END = 21 * 60;
let now = 11 * 60 + 5;
let variant = 'A';
let cFilter = 'rotina';
let editing = null;
let justId = null;
let focusNote = false;

const tasks = [
  { id: 1, t: 8 * 60, title: 'Conferir a agenda do dia na recepção', doneAt: 8 * 60 + 6, note: '' },
  { id: 2, t: 9 * 60 + 30, title: 'Responder o direct do Instagram da academia', doneAt: 10 * 60 + 12, note: '12 mensagens, 3 viraram lead' },
  { id: 3, t: 10 * 60 + 30, title: 'Conferir a limpeza e a organização da recepção', doneAt: null, note: '' },
  { id: 4, t: 11 * 60, title: 'Postar o story da aula das 12h', doneAt: null, note: '' },
  { id: 5, t: 18 * 60, title: 'Mandar o resumo do dia no grupo da equipe', doneAt: null, note: '' },
  { id: 6, t: null, title: 'Revisar as perdas da semana', repeat: 'Segundas e terças', doneAt: null, note: '' },
];

const pad = (n) => String(n).padStart(2, '0');
const hhmm = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const dur = (m) => (m < 60 ? `${m} min` : `${Math.floor(m / 60)}h${m % 60 ? ` ${m % 60}min` : ''}`);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const isDone = (x) => x.doneAt != null && x.doneAt <= now;

function stateOf(x) {
  if (isDone(x)) return x.t != null && x.doneAt > x.t + TOL ? 'doneLate' : 'done';
  if (x.t == null) return 'open';
  if (now < x.t) return 'later';
  if (now <= x.t + TOL) return 'now';
  return 'late';
}

function metaOf(x, s) {
  if (s === 'done') return `Feita às ${hhmm(x.doneAt)}`;
  if (s === 'doneLate') return `Feita às ${hhmm(x.doneAt)}, depois do horário`;
  if (s === 'now') return 'É agora';
  if (s === 'late') return `Era às ${hhmm(x.t)}, atrasada há ${dur(now - x.t)}`;
  if (s === 'later') return `Em ${dur(x.t - now)}`;
  return x.repeat ? `${x.repeat} · até o fim do dia` : 'Até o fim do dia';
}

const ordered = () => [...tasks.filter((x) => x.t != null).sort((a, b) => a.t - b.t), ...tasks.filter((x) => x.t == null)];
const doneN = () => tasks.filter(isDone).length;
const lateN = () => tasks.filter((x) => stateOf(x) === 'late').length;

function checkBtn(x) {
  const done = isDone(x);
  return `<button type="button" class="rt-check${justId === x.id ? ' just' : ''}" data-check="${x.id}" aria-pressed="${done}" aria-label="${done ? 'Desmarcar' : 'Marcar como feita'}: ${esc(x.title)}">${done ? ICON.check : ''}</button>`;
}

function row(x) {
  const s = stateOf(x);
  const done = s === 'done' || s === 'doneLate';
  const note = done && x.note && editing !== x.id ? `<p class="rt-note">${ICON.note}<span>${esc(x.note)}</span></p>` : '';
  const edit = done && editing === x.id ? `
    <div class="rt-edit">
      <input data-note="${x.id}" value="${esc(x.note)}" maxlength="140" placeholder="Observação (opcional)" aria-label="Observação sobre ${esc(x.title)}">
      <button type="button" class="btn-ink" data-save="${x.id}">Salvar</button>
      <button type="button" class="rt-link" data-check="${x.id}">Desfazer</button>
    </div>` : '';
  return `
  <li class="rt-row is-${s}">
    <span class="rt-time t">${x.t != null ? hhmm(x.t) : ICON.repeat}</span>
    ${checkBtn(x)}
    <div>
      <p class="rt-title">${esc(x.title)}</p>
      <p class="rt-meta">${metaOf(x, s)}</p>
      ${note}${edit}
    </div>
  </li>`;
}

const needle = () => `<li class="rt-needle" aria-hidden="true"><span class="rt-needle-tag t">${hhmm(now)}</span><span class="rt-needle-bar"></span></li>`;

function timedList() {
  let html = '';
  let placed = false;
  tasks.filter((x) => x.t != null).sort((a, b) => a.t - b.t).forEach((x) => {
    if (!placed && x.t > now) { html += needle(); placed = true; }
    html += row(x);
  });
  if (!placed) html += needle();
  return `<ol class="rt-list">${html}</ol>`;
}

const freeList = () => `
  <div class="rt-free">
    <p class="rt-free-label">Sem horário</p>
    <ol class="rt-list rt-list--free">${tasks.filter((x) => x.t == null).map(row).join('')}</ol>
  </div>`;

function routineHead(sub) {
  return `
  <div class="rt-head">
    <span class="rt-ico">${ICON.list}</span>
    <div><h3>Rotina de hoje</h3><p>${sub}</p></div>
    <div class="rt-count">
      <div class="t"><b>${doneN()}</b> de ${tasks.length}</div>
      <div class="segs" aria-hidden="true">${ordered().map((x) => `<span class="seg ${stateOf(x)}"></span>`).join('')}</div>
    </div>
  </div>`;
}

const routineCard = (wide = false) => `
  <section class="card${wide ? ' rt--wide' : ''}" aria-label="Rotina de hoje">
    ${routineHead('Montada pelo gestor. Não conta na sua meta.')}
    ${timedList()}
    ${freeList()}
  </section>`;

/* ---------- B: faixa do dia ---------- */
function strip() {
  const pct = (m) => (((Math.min(Math.max(m, START), END) - START) / (END - START)) * 100).toFixed(2);
  const hours = [7, 9, 11, 13, 15, 17, 19, 21].map((h) => `<span class="strip-hour t" style="left:${pct(h * 60)}%">${pad(h)}h</span>`).join('');
  const nodes = tasks.filter((x) => x.t != null).map((x) => `
    <div class="strip-node is-${stateOf(x)}" style="left:${pct(x.t)}%">
      <span class="strip-time t">${hhmm(x.t)}</span>
      ${checkBtn(x)}
      <span class="tip" role="presentation">${esc(x.title)}</span>
    </div>`).join('');
  const focus = tasks.filter((x) => ['now', 'late'].includes(stateOf(x)) || editing === x.id).sort((a, b) => (a.t ?? 9999) - (b.t ?? 9999));
  const next = tasks.filter((x) => stateOf(x) === 'later').sort((a, b) => a.t - b.t)[0];
  const focusHtml = focus.length
    ? `<ol class="rt-list rt-list--free">${focus.map(row).join('')}</ol>`
    : `<p class="strip-empty">Nada pendente até agora.${next ? ` A próxima é às <b class="t">${hhmm(next.t)}</b>: ${esc(next.title)}.` : ' Acabou a rotina com horário de hoje.'}</p>`;
  return `
  <section class="card" aria-label="Rotina de hoje">
    ${routineHead('Sua jornada de hoje, montada pelo gestor. Não conta na sua meta.')}
    <div class="strip">
      <div class="strip-track">
        <div class="strip-line"></div>
        <div class="strip-past" style="width:${pct(now)}%"></div>
        ${hours}
        ${nodes}
        <div class="strip-needle" style="left:${pct(now)}%"><span>${hhmm(now)}</span></div>
      </div>
    </div>
    <div class="strip-foot">
      <div><p class="rt-free-label">Para agora</p>${focusHtml}</div>
      <div><p class="rt-free-label">Sem horário</p><ol class="rt-list rt-list--free">${tasks.filter((x) => x.t == null).map(row).join('')}</ol></div>
    </div>
  </section>`;
}

/* ---------- A Meta diária de hoje, simplificada ---------- */
const hero = () => `
  <section class="card hero">
    <div>
      <p class="eyebrow"><span style="color:var(--brand)">${ICON.target}</span>Meta diária</p>
      <h2>Bom dia, Carla. Você tem <em>3 tarefas</em> antes de fechar o dia.</h2>
      <p>Foque nos novos leads recentes e nas visitas/aulas agendadas. Os atrasados podem esperar o fim do turno.</p>
    </div>
    <div class="score">
      <div class="score-n">
        <p class="eyebrow" style="justify-content:flex-end">Concluído hoje</p>
        <div class="big t">63<span>%</span></div>
        <small class="t">5 de 8 tarefas · 6 de 10 ações</small>
      </div>
      <svg class="dial" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="38" stroke="var(--soft)" stroke-width="8" fill="none"/><circle cx="50" cy="50" r="38" stroke="var(--brand)" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="238.8" stroke-dashoffset="88.4" transform="rotate(-90 50 50)"/></svg>
    </div>
    <div class="catbar" aria-hidden="true">
      <span style="flex:2;background:#2563EB"></span><span style="flex:1;background:#7C3AED"></span><span style="flex:3;background:#0D9488"></span><span style="flex:2;background:#E11D48"></span>
    </div>
  </section>`;

const chip = (label, n, { pressed = false, dot = '', attrs = '' } = {}) =>
  `<button type="button" class="chip" aria-pressed="${pressed}" ${attrs}>${dot ? `<span class="dot" style="background:${dot}"></span>` : ''}${label}<span class="n">${n}</span></button>`;

function chips(withRoutine) {
  const todosPressed = withRoutine ? cFilter === 'todos' : true;
  const rot = withRoutine ? `
    <span class="sep" aria-hidden="true"></span>
    <button type="button" class="chip chip--rotina" aria-pressed="${cFilter === 'rotina'}" data-cfilter="rotina">
      ${ICON.list}Rotina<span class="n t">${doneN()}/${tasks.length}</span>${lateN() ? `<span class="chip-alert" title="${lateN()} atrasada${lateN() > 1 ? 's' : ''}"></span>` : ''}
    </button>` : '';
  return `
  <div class="chips">
    ${chip('Todos', 3, { pressed: todosPressed, attrs: withRoutine ? 'data-cfilter="todos"' : '' })}
    ${chip('Novos leads', 1, { dot: '#3B82F6' })}${chip('Visitas', 0, { dot: '#8B5CF6' })}${chip('Contatos', 1, { dot: '#14B8A6' })}${chip('Atrasados', 1, { dot: '#F43F5E' })}
    <span class="sep" aria-hidden="true"></span>
    ${chip('Amanhã', 2)}
    ${rot}
  </div>`;
}

const lead = (name, phone, tag, tagStyle, when) => `
  <div class="lead">
    <span class="avatar">${name.split(' ').map((p) => p[0]).join('')}</span>
    <div class="grow"><p class="lead-name">${name}</p><p class="lead-phone t">${phone}</p></div>
    <span class="tag" style="${tagStyle}">${tag}</span>
    <span class="tag t" style="background:var(--soft)">${when}</span>
    <button type="button" class="btn-ink">Concluir</button>
  </div>`;

const sec = (label, n, color, body) => `
  <div><div class="sec-head"><span class="dot" style="background:${color}"></span>${label}<span class="t">${n}</span><span class="rule"></span></div>${body}</div>`;

const leadList = () => `
  <div class="todo-body">
    ${sec('Novos leads (24h)', 1, '#3B82F6', lead('Rafael Moura', '(51) 99812-4410', 'Novos leads', 'background:rgba(59,130,246,.1);color:#2563EB', 'Ontem 19:40'))}
    ${sec('Contato hoje', 1, '#14B8A6', lead('Juliana Pires', '(51) 98455-1203', 'Contatos', 'background:rgba(20,184,166,.12);color:#0D9488', 'Hoje 15:00'))}
    ${sec('Atrasados', 1, '#F43F5E', lead('Bruno Teixeira', '(51) 99107-7782', 'Atrasados', 'background:rgba(244,63,94,.1);color:#E11D48', '2 dias'))}
  </div>`;

function todoCard(withRoutine = false) {
  const showRoutine = withRoutine && cFilter === 'rotina';
  return `
  <section class="card">
    <div class="todo-head">
      <h2>${showRoutine ? 'Rotina de hoje' : 'A fazer hoje'}</h2>
      <span class="count">${showRoutine ? `${doneN()}/${tasks.length}` : 3}</span>
      ${showRoutine ? '<span style="font-size:12px;color:var(--muted)">Montada pelo gestor. Não conta na sua meta.</span>' : ''}
    </div>
    ${chips(withRoutine)}
    ${showRoutine ? `<div class="rt--wide" style="padding:6px 6px 8px">${timedList()}${freeList()}</div>` : leadList()}
  </section>`;
}

const nextUp = `
  <section class="card side-card">
    <div style="display:flex;justify-content:space-between"><p class="eyebrow">Próximo compromisso</p><span class="t" style="font-size:11px;color:var(--muted)">14:00</span></div>
    <div class="next">
      <span class="avatar">MC</span>
      <div style="flex:1;min-width:0"><p class="lead-name">Mariana Costa</p><p class="lead-phone t">(51) 99633-0921</p></div>
      <span class="badge">Visita</span>
    </div>
  </section>`;

const agenda = `
  <section class="card">
    <div class="ag-head">
      <span class="ag-ico">${ICON.cal}</span>
      <div style="flex:1;min-width:0"><h3 style="font-size:13.5px;font-weight:600">Agenda de hoje</h3><p>Visitas e aulas da academia · não conta na sua meta</p></div>
    </div>
    <div class="ag-list">
      <div class="ag-row"><span class="t">14:00</span><b style="font-weight:500">Mariana Costa</b><span>Visita · sua</span></div>
      <div class="ag-row"><span class="t">19:00</span><b style="font-weight:500">Pedro Lima</b><span>Pilates · de Diego</span></div>
    </div>
  </section>`;

const streak = `
  <section class="card side-card">
    <div style="display:flex;justify-content:space-between;align-items:center"><p class="eyebrow">Ritmo do mês</p>${ICON.flame}</div>
    <p style="margin-top:6px"><b class="t" style="font-size:22px;font-weight:600">3/4</b> <span style="font-size:12px;color:var(--muted)">dias batidos</span></p>
    <div class="streak" aria-hidden="true">${Array.from({ length: 14 }, (_, i) => `<i class="${i === 13 ? 'today' : [1, 2, 4, 5, 8, 9, 11, 12].includes(i) ? 'hit' : ''}"></i>`).join('')}</div>
  </section>`;

const doneToday = `
  <section class="card side-card">
    <h3>Feitos hoje <span class="count" style="background:rgba(16,185,129,.12);color:var(--done)">5</span></h3>
    <p style="margin-top:8px;font-size:12px;color:var(--muted)">As cinco tarefas de lead concluídas até agora.</p>
  </section>`;

/* ---------- as três opções ---------- */
const VARIANTS = {
  A: {
    tab: 'A · Cartão na lateral',
    title: 'A · Cartão na lateral, logo abaixo do Próximo compromisso',
    pro: 'Fica sempre à vista, seja qual for o filtro da lista, e ao lado do Próximo compromisso, que também segue o relógio do dia. A lista de leads não muda.',
    con: 'A lateral fica mais comprida e empurra a Agenda de hoje e o Ritmo para baixo. Numa tela estreita a lateral desce para depois da lista, e a rotina vai junto.',
    body: () => `${hero()}<div class="layout">${todoCard()}<div class="side">${nextUp}${routineCard()}${agenda}${streak}${doneToday}</div></div>`,
  },
  B: {
    tab: 'B · Faixa do dia',
    title: 'B · Faixa do dia, entre o topo e a lista',
    pro: 'Mostra a jornada inteira de uma vez, com o agora marcado na linha. É a que mais se parece com um dia organizado pelo gestor.',
    con: 'Ocupa uma faixa larga antes da lista de leads. Tarefas com horários próximos ficam coladas na linha, e o nome só aparece ao passar o mouse ou em "Para agora". Numa tela estreita a linha rola para o lado.',
    body: () => `${hero()}${strip()}<div class="layout">${todoCard()}<div class="side">${nextUp}${agenda}${streak}${doneToday}</div></div>`,
  },
  C: {
    tab: 'C · Filtro na lista',
    title: 'C · Filtro na lista, ao lado do Amanhã',
    pro: 'Usa o espaço grande da lista e funciona como o filtro Amanhã, que já existe. A rotina fica separada das tarefas de lead. Toque em Todos e em Rotina para alternar.',
    con: 'Fica atrás de um clique. Olhando os leads, o consultor só percebe uma tarefa atrasada pelo ponto vermelho no filtro.',
    body: () => `${hero()}<div class="layout">${todoCard(true)}<div class="side">${nextUp}${agenda}${streak}${doneToday}</div></div>`,
  },
};

const $ = (id) => document.getElementById(id);

function render() {
  const v = VARIANTS[variant];
  $('tabs').innerHTML = Object.entries(VARIANTS).map(([id, x]) =>
    `<button type="button" class="tab" role="tab" aria-selected="${id === variant}" data-variant="${id}">${x.tab}</button>`).join('');
  $('v-title').textContent = v.title;
  $('verdict').innerHTML = `<p><b>A favor.</b> ${v.pro}</p><p><b>Contra.</b> ${v.con}</p>`;
  $('screen').innerHTML = v.body();
  $('clock-out').textContent = hhmm(now);
  const dark = document.documentElement.dataset.theme === 'dark';
  $('theme').innerHTML = `${dark ? ICON.sun : ICON.moon}${dark ? 'Tema claro' : 'Tema escuro'}`;
  if (focusNote && editing != null) $('screen').querySelector(`[data-note="${editing}"]`)?.focus();
  focusNote = false;
  justId = null;
}

function saveNote(id) {
  const x = tasks.find((t) => t.id === id);
  const input = $('screen').querySelector(`[data-note="${id}"]`);
  if (x && input) x.note = input.value.trim();
  editing = null;
  render();
}

$('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-variant]');
  if (b) { variant = b.dataset.variant; editing = null; render(); }
});

$('screen').addEventListener('click', (e) => {
  const check = e.target.closest('[data-check]');
  if (check) {
    const x = tasks.find((t) => t.id === Number(check.dataset.check));
    if (isDone(x)) { x.doneAt = null; x.note = ''; editing = null; }
    else { x.doneAt = now; editing = x.id; justId = x.id; focusNote = true; }
    render();
    return;
  }
  const save = e.target.closest('[data-save]');
  if (save) { saveNote(Number(save.dataset.save)); return; }
  const f = e.target.closest('[data-cfilter]');
  if (f) { cFilter = f.dataset.cfilter; render(); }
});

$('screen').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('[data-note]')) saveNote(Number(e.target.dataset.note));
  if (e.key === 'Escape' && e.target.matches('[data-note]')) { editing = null; render(); }
});

$('clock').addEventListener('input', (e) => { now = Number(e.target.value); render(); });

$('theme').addEventListener('click', () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  render();
});

render();
</script>
</body>
</html>
