<!doctype html>
<html lang="pt-BR" translate="no" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Tela Rotinas do gestor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tokens: os do Stronilead (src/index.css) e os estados da rotina, iguais aos
   do mockup da Meta diária (2026-10-06-rotina-na-meta-diaria.html). */
:root {
  --bg: #F5F7FB;
  --card: #FFFFFF;
  --card-solid: #FFFFFF;
  --ink: #0E1A40;
  --muted: #64748B;
  --line: #E2E8F0;
  --line-strong: #CBD5E1;
  --soft: #F1F4F9;
  --brand: #2B59FF;
  --brand-ink: #1E44D6;
  --brand-soft: rgba(43, 89, 255, .08);
  --done: #059669;
  --warn: #B45309;
  --warn-soft: rgba(245, 158, 11, .14);
  --late: #E11D48;
  --late-solid: #FFF1F3;
  --shadow: 0 1px 0 rgba(15, 23, 42, .04), 0 1px 2px rgba(15, 23, 42, .06);
  --shadow-pop: 0 24px 48px -16px rgba(14, 26, 64, .28), 0 2px 8px rgba(14, 26, 64, .08);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #080D22;
  --card: rgba(255, 255, 255, .025);
  --card-solid: #0F152B;
  --ink: #EAEEF9;
  --muted: #8A93B0;
  --line: rgba(255, 255, 255, .07);
  --line-strong: rgba(255, 255, 255, .2);
  --soft: rgba(255, 255, 255, .05);
  --brand: #5A7FFF;
  --brand-ink: #9BB0FF;
  --brand-soft: rgba(90, 127, 255, .13);
  --done: #34D399;
  --warn: #FBBF24;
  --warn-soft: rgba(251, 191, 36, .14);
  --late: #FB7185;
  --late-solid: #2A1326;
  --shadow: none;
  --shadow-pop: 0 24px 48px -12px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 Geist, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
ol, ul { list-style: none; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.t { font-family: 'Space Grotesk', Geist, sans-serif; font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
svg.i { width: 15px; height: 15px; flex-shrink: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- barra do mockup (fora do app) ---------- */
.chrome { position: sticky; top: 0; z-index: 40; background: #0E1A40; color: #fff; border-bottom: 1px solid rgba(255, 255, 255, .08); }
:root[data-theme="dark"] .chrome { background: #0C1432; }
.chrome-in { padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.chrome-name { display: flex; align-items: center; gap: 8px; font: 600 13.5px/1 'Space Grotesk', sans-serif; }
.chrome-name small { font: 600 9.5px/1 Geist, sans-serif; letter-spacing: .09em; text-transform: uppercase; color: #FF8A57; border: 1px solid rgba(255, 138, 87, .45); padding: 4px 6px; border-radius: 5px; }
.tabs { max-width: 100%; overflow-x: auto; display: flex; gap: 3px; background: rgba(255, 255, 255, .07); padding: 3px; border-radius: 10px; }
.tab { height: 30px; padding: 0 12px; border-radius: 7px; font-size: 12.5px; font-weight: 500; color: rgba(255, 255, 255, .72); white-space: nowrap; }
.tab[aria-pressed="true"] { background: #fff; color: #0E1A40; }
.clock { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 12px; color: rgba(255, 255, 255, .72); }
.clock input { width: 180px; accent-color: #5A7FFF; }
.clock output { font: 600 16px/1 'Space Grotesk', sans-serif; color: #fff; min-width: 46px; }
.theme { height: 30px; padding: 0 10px; border: 1px solid rgba(255, 255, 255, .16); border-radius: 8px; font-size: 12px; color: rgba(255, 255, 255, .85); display: inline-flex; align-items: center; gap: 6px; }
@media (max-width: 760px) { .chrome { position: static; } .clock { margin-left: 0; width: 100%; } .clock input { flex: 1; width: auto; } }

/* ---------- casca do app ---------- */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: calc(100vh - 51px); }
.nav { border-right: 1px solid var(--line); background: var(--card-solid); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; }
.wordmark { font: 500 17px/1 'Space Grotesk', sans-serif; letter-spacing: .02em; padding: 6px 10px 22px; }
.wordmark b { color: var(--brand); font-weight: 700; }
.nav-item { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; font-size: 13.5px; color: var(--muted); }
.nav-item.on { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.nav-item .new { margin-left: auto; font-size: 10px; font-weight: 600; letter-spacing: .04em; color: var(--brand); border: 1px solid color-mix(in srgb, var(--brand) 40%, transparent); border-radius: 5px; padding: 1px 5px; }
.nav-group { margin: 18px 10px 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 900px) { .shell { grid-template-columns: 1fr; } .nav { display: none; } }

.page { padding: 26px 28px 64px; min-width: 0; }
@media (max-width: 600px) { .page { padding: 20px 16px 56px; } }
.eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 7px; }
.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px 24px; }
.page-head h1 { margin-top: 8px; max-width: 720px; font: 500 27px/1.2 'Space Grotesk', sans-serif; letter-spacing: -.02em; }
.page-head h1 em { font-style: normal; font-weight: 700; }
.page-head h1 .ok { color: var(--brand); }
.page-head h1 .bad { color: var(--late); }
.page-head h1 .warn { color: var(--warn); }
.btn-primary { height: 38px; padding: 0 14px; border-radius: 10px; background: var(--brand); color: #fff; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn-ghost { height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--card-solid); font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn-danger { height: 34px; padding: 0 12px; border-radius: 9px; font-size: 12.5px; font-weight: 500; color: var(--late); white-space: nowrap; }
.btn-danger.solid { background: var(--late); color: #fff; }
.link { color: var(--brand); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--brand) 35%, transparent); }
.subtabs { margin-top: 22px; display: flex; gap: 6px; border-bottom: 1px solid var(--line); }
.subtab { height: 40px; padding: 0 12px; font-size: 13.5px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 8px; }
.subtab[aria-selected="true"] { color: var(--ink); border-color: var(--brand); }
.subtab .n { font: 600 11px/18px 'Space Grotesk', sans-serif; padding: 0 6px; border-radius: 5px; background: var(--soft); color: var(--muted); }
.subtab .n.warn { background: var(--warn-soft); color: var(--warn); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--muted); font-size: 11px; font-weight: 600; flex-shrink: 0; }
.avatar.sm { width: 24px; height: 24px; font-size: 9.5px; }
.stack { display: flex; align-items: center; min-width: 0; }
.stack .avatar { border: 2px solid var(--card-solid); margin-left: -6px; }
.stack .avatar:first-child { margin-left: 0; }
.section-title { margin: 30px 0 12px; display: flex; align-items: baseline; gap: 10px; }
.section-title h2 { font: 600 16px/1.2 'Space Grotesk', sans-serif; }
.section-title p { font-size: 12.5px; color: var(--muted); }
.hint { font-size: 11.5px; color: var(--muted); }

/* ---------- Modelos ---------- */
.models { margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.mcard { text-align: left; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 12px; transition: border-color .15s; }
.mcard:hover { border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); }
.mcard-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.mcard h3 { font: 600 16px/1.25 'Space Grotesk', sans-serif; letter-spacing: -.01em; }
.mcard-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
.mcard-open { font-size: 12px; font-weight: 600; color: var(--brand); white-space: nowrap; }
.mcard-people { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.mcard-people.none { color: var(--warn); }
/* a faixa do dia de cada modelo: quando as tarefas acontecem, de 07h a 21h */
.dayline { position: relative; height: 34px; }
.dayline .base { position: absolute; left: 0; right: 0; top: 10px; height: 2px; border-radius: 2px; background: var(--line); }
.dayline .span { position: absolute; top: 10px; height: 2px; border-radius: 2px; background: color-mix(in srgb, var(--brand) 35%, transparent); }
.dayline .dot { position: absolute; top: 6px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--card-solid); border: 2px solid var(--brand); }
.dayline .hr { position: absolute; top: 20px; transform: translateX(-50%); font: 500 10px/1 'Space Grotesk', sans-serif; color: var(--muted); }
.dayline .hr.start { transform: none; }
.dayline .hr.end { transform: translateX(-100%); }
.people-card { overflow: hidden; }
.prow-assign { display: grid; grid-template-columns: 30px minmax(0, 1fr) minmax(180px, 260px) 110px; gap: 12px; align-items: center; padding: 11px 16px; }
.prow-assign + .prow-assign { border-top: 1px solid var(--line); }
.prow-assign .who b { font-size: 13.5px; font-weight: 600; display: block; }
.prow-assign .who small { font-size: 11.5px; color: var(--muted); }
.prow-assign.none .who small { color: var(--warn); }
.prow-assign.none { background: color-mix(in srgb, var(--warn) 6%, transparent); }
.select { height: 36px; border: 1px solid var(--line); border-radius: 9px; background: var(--card-solid); padding: 0 10px; font-size: 13px; width: 100%; }
@media (max-width: 720px) { .prow-assign { grid-template-columns: 30px minmax(0, 1fr); } .prow-assign .select, .prow-assign .go { grid-column: 2; } }

/* ---------- dentro de um modelo ---------- */
.crumb { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.crumb button { color: var(--brand); font-weight: 500; }
.model-head { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
.model-head h1 { font: 600 28px/1.15 'Space Grotesk', sans-serif; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; }
.rename { font: 500 12px/1 Geist, sans-serif; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.rename-input { height: 42px; font: 600 24px/1 'Space Grotesk', sans-serif; border: 1px solid var(--brand); border-radius: 10px; padding: 0 10px; background: var(--card-solid); min-width: 280px; }
.model-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.confirm { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--late-solid); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }
.model-grid { margin-top: 20px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
@media (max-width: 1100px) { .model-grid { grid-template-columns: 1fr; } }
.box-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.box-head h2 { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.box-head h2 .n { font: 600 11px/18px 'Space Grotesk', sans-serif; padding: 0 6px; border-radius: 5px; background: var(--soft); color: var(--muted); }
.mtasks { padding: 8px 10px; position: relative; }
.mtasks::before { content: ""; position: absolute; top: 26px; bottom: 26px; left: calc(10px + 8px + 46px + 10px + 6px); width: 2px; background: var(--line); border-radius: 2px; }
.mtask { display: grid; grid-template-columns: 46px 14px minmax(0, 1fr) auto; column-gap: 10px; align-items: start; padding: 10px 8px; border-radius: 12px; }
.mtask:hover { background: var(--soft); }
.mtask .time { font: 600 13px/18px 'Space Grotesk', sans-serif; color: var(--muted); text-align: right; display: flex; justify-content: flex-end; }
.mtask .node { width: 14px; height: 14px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--brand); background: var(--card-solid); position: relative; z-index: 1; }
.mtask.paused .node { border-color: var(--line-strong); }
.mtask .title { font-size: 13.5px; font-weight: 500; }
.mtask.paused .title, .mtask.paused .time { color: var(--muted); }
.mtask .how { font-size: 12px; color: var(--muted); margin-top: 2px; }
.mtask .when { font-size: 11.5px; color: var(--muted); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--soft); color: var(--muted); }
.mtasks-free { margin: 0 10px; padding: 6px 0 4px; border-top: 1px dashed var(--line); }
.mtasks-free .lbl { padding: 6px 8px 0; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mtasks-free .mtasks { padding: 4px 0; }
.mtasks-free .mtasks::before { display: none; }
.empty { padding: 26px 18px; text-align: center; color: var(--muted); font-size: 13px; }
.followers { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
.follower { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.follower b { font-weight: 500; flex: 1; }
.follower button { font-size: 12px; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
.add-follower { margin-top: 6px; }
.version-note { display: flex; gap: 8px; font-size: 12px; background: var(--brand-soft); padding: 10px 12px; border-radius: 10px; margin-top: 12px; }
.version-note svg.i { color: var(--brand); margin-top: 1px; }

/* ---------- Hoje ---------- */
.today { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; margin-top: 20px; align-items: start; }
@media (max-width: 1180px) { .today { grid-template-columns: 1fr; } }
.mark { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--card-solid); display: grid; place-items: center; color: #fff; position: relative; z-index: 1; }
.mark svg.i { width: 12px; height: 12px; }
.is-done .mark, .is-doneLate .mark { background: var(--done); border-color: var(--done); }
.is-doneLate .mark { box-shadow: 0 0 0 2px var(--card-solid), 0 0 0 4px var(--warn); }
.is-late .mark { border-color: var(--late); background: var(--late-solid); }
.is-now .mark { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
.na { width: 5px; height: 5px; border-radius: 50%; background: var(--line-strong); display: inline-block; opacity: .7; }
.segs { display: flex; gap: 2px; }
.seg { width: 8px; height: 3px; border-radius: 2px; background: var(--line-strong); }
.seg.done, .seg.doneLate { background: var(--done); }
.seg.late { background: var(--late); }
.seg.now { background: var(--brand); }
.task-time { font: 600 12.5px/20px 'Space Grotesk', sans-serif; color: var(--muted); text-align: right; }
.icon-repeat { color: var(--muted); display: inline-flex; }

.people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.pcard-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.pcard-head b { font-size: 13.5px; font-weight: 600; display: block; }
.pcard-head .model-link { font-size: 11.5px; color: var(--brand); text-decoration: underline; text-underline-offset: 2px; }
.pcard-head .count { margin-left: auto; text-align: right; }
.pcard-head .count .t { font-size: 12px; color: var(--muted); }
.pcard-head .count .t b { font-size: 16px; color: var(--ink); display: inline; }
.plist { padding: 6px 8px 8px; }
.prow { width: 100%; text-align: left; display: grid; grid-template-columns: 40px 22px minmax(0, 1fr); gap: 9px; padding: 6px; align-items: start; border-radius: 10px; }
.prow:hover { background: var(--soft); }
.prow.is-now { background: var(--brand-soft); }
.prow[aria-pressed="true"] { box-shadow: inset 0 0 0 1px var(--brand); }
.prow .task-time { line-height: 22px; }
.prow.is-late .task-time { color: var(--late); }
.prow .ptitle { display: block; font-size: 12.5px; font-weight: 500; line-height: 1.35; }
.prow small { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }
.prow.is-late small { color: var(--late); }
.prow.is-doneLate small { color: var(--warn); }
.prow.is-done small { color: var(--done); }
.pneedle { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 9px; align-items: center; padding: 2px 6px; }
.pneedle span:first-child { font: 600 10.5px/1 'Space Grotesk', sans-serif; background: var(--brand); color: #fff; border-radius: 4px; padding: 3px 0; text-align: center; }
.pneedle span:last-child { height: 2px; background: var(--brand); border-radius: 2px; }
.pcard-none { padding: 18px 14px; font-size: 12.5px; color: var(--warn); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }

.board-card { overflow: hidden; }
.board-wrap { overflow-x: auto; overscroll-behavior-x: contain; }
table.board { width: 100%; min-width: 640px; border-collapse: separate; border-spacing: 0; }
.board th, .board td { padding: 10px 6px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; }
.board tr:last-child td, .board tr:last-child th { border-bottom: 0; }
.board .col-task { text-align: left; position: sticky; left: 0; z-index: 3; background: var(--card-solid); min-width: 250px; padding-left: 16px; box-shadow: 1px 0 0 var(--line); font-weight: 400; }
.board thead th { padding-top: 14px; padding-bottom: 12px; background: var(--card-solid); }
.board thead .col-task { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); vertical-align: bottom; }
.person { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 64px; }
.person b { font-size: 12.5px; font-weight: 600; }
.person .t { font-size: 11px; color: var(--muted); }
.task-cell { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 10px; align-items: start; }
.task-title { font-size: 13px; font-weight: 500; line-height: 1.35; }
.task-who { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.cell-btn { width: 36px; height: 36px; border-radius: 10px; display: inline-grid; place-items: center; }
.cell-btn:hover { background: var(--soft); }
.cell-btn[aria-pressed="true"] { background: var(--brand-soft); }
.board .free-head td { background: var(--soft); padding: 6px 16px; text-align: left; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.board .needle td { padding: 0; height: 22px; border-bottom: 0; position: relative; }
.board .needle .col-task { background: transparent; box-shadow: none; }
.needle-line { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--brand); }
.needle-tag { position: absolute; left: 16px; top: 2px; z-index: 4; font: 600 11px/1 'Space Grotesk', sans-serif; background: var(--brand); color: #fff; padding: 4px 6px; border-radius: 5px; white-space: nowrap; }
.needle-tag::after { content: "agora"; margin-left: 6px; font: 600 9.5px/1 Geist, sans-serif; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }

.aside { display: flex; flex-direction: column; gap: 12px; }
.aside-card { padding: 14px 16px; }
.aside-card h3 { font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.aside-card h3 .n { font: 600 11px/18px 'Space Grotesk', sans-serif; padding: 0 6px; border-radius: 5px; background: var(--late-solid); color: var(--late); }
.aside-card h3 .n.neutral { background: var(--soft); color: var(--muted); }
.aside-list { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
.aside-row { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; font-size: 12.5px; }
.aside-row p { line-height: 1.35; }
.aside-row small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.aside-row small.bad { color: var(--late); }
.aside-row .quote { display: block; margin-top: 5px; background: var(--soft); border-radius: 7px; padding: 5px 8px; font-size: 12px; }
.aside-empty { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.detail { border-color: color-mix(in srgb, var(--brand) 40%, var(--line)); }
.detail-top { display: flex; justify-content: space-between; align-items: center; }
.detail-x { font-size: 12px; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }

/* ---------- painéis laterais ---------- */
.backdrop { position: fixed; inset: 0; background: rgba(8, 13, 34, .45); z-index: 50; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); z-index: 51; background: var(--card-solid); border-left: 1px solid var(--line); box-shadow: var(--shadow-pop); display: flex; flex-direction: column; animation: slide .22s ease-out; }
.sheet-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sheet-head h2 { font: 600 19px/1.2 'Space Grotesk', sans-serif; letter-spacing: -.01em; }
.sheet-head p { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.sheet-body { padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; flex: 1; }
.field { display: flex; flex-direction: column; gap: 7px; }
.field > .lbl { font-size: 12.5px; font-weight: 600; }
.field > .lbl span { font-weight: 400; color: var(--muted); }
.input, .textarea { width: 100%; border: 1px solid var(--line); border-radius: 9px; background: var(--card-solid); padding: 0 11px; font-size: 13.5px; }
.input { height: 38px; }
.textarea { padding: 9px 11px; min-height: 70px; resize: vertical; }
.input::placeholder, .textarea::placeholder { color: var(--muted); }
.input[aria-invalid="true"] { border-color: var(--late); }
.seg-ctl { display: inline-flex; flex-wrap: wrap; background: var(--soft); padding: 3px; border-radius: 10px; gap: 2px; align-self: flex-start; }
.seg-ctl button { height: 32px; padding: 0 12px; border-radius: 8px; font-size: 12.5px; font-weight: 500; color: var(--muted); }
.seg-ctl button[aria-pressed="true"] { background: var(--card-solid); color: var(--ink); box-shadow: var(--shadow); }
:root[data-theme="dark"] .seg-ctl button[aria-pressed="true"] { background: rgba(255, 255, 255, .1); }
.days { display: flex; flex-wrap: wrap; gap: 6px; }
.days button { width: 44px; height: 34px; border-radius: 9px; border: 1px solid var(--line); font-size: 12.5px; font-weight: 500; color: var(--muted); }
.days button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
.time-input { width: 120px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; }
.pick { display: flex; flex-direction: column; gap: 6px; }
.pick label { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; cursor: pointer; }
.pick label small { margin-left: auto; font-size: 11.5px; color: var(--muted); }
.pick input { width: 16px; height: 16px; accent-color: var(--brand); }
.err { font-size: 11.5px; color: var(--late); }
.sheet-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.sheet-foot .left { display: flex; gap: 4px; }
.sheet-foot .right { display: flex; gap: 8px; margin-left: auto; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow-pop); animation: rise .2s ease-out; max-width: calc(100vw - 32px); }

@keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="chrome">
  <div class="chrome-in">
    <div class="chrome-name"><small>Mockup</small>Tela Rotinas do gestor</div>
    <div class="tabs" id="layout-tabs" aria-label="Como mostrar o Hoje"></div>
    <label class="clock">Hora simulada
      <input type="range" id="clock" min="420" max="1260" step="5" value="665">
      <output id="clock-out" class="t">11:05</output>
    </label>
    <button class="theme" id="theme" type="button"></button>
  </div>
</div>

<div class="shell">
  <nav class="nav" aria-label="Menu">
    <div class="wordmark">STRONI<b>LEAD</b></div>
    <a class="nav-item" href="#">Visão geral</a>
    <a class="nav-item" href="#">Pipeline</a>
    <a class="nav-item" href="#">Clientes</a>
    <a class="nav-item" href="#">Meta diária</a>
    <a class="nav-item on" href="#" aria-current="page">Rotinas<span class="new">Novo</span></a>
    <a class="nav-item" href="#">Leads</a>
    <a class="nav-item" href="#">Suporte</a>
    <p class="nav-group">Administração</p>
    <a class="nav-item" href="#">Configurações</a>
  </nav>
  <main class="page" id="page"></main>
</div>

<div id="overlay"></div>

<script>
const ICON = {
  check: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  plus: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  list: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>',
  repeat: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>',
  copy: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  info: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
  moon: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>',
  sun: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
};

// A tarefa fica "agora" do horário até 30 minutos depois, como na Meta diária.
const TOL = 30;
const DAY_START = 7 * 60;
const DAY_END = 21 * 60;
const TODAY = 2; // terça
const DAY_NAMES = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const DAY_LONG = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];

const PEOPLE = [
  { id: 'carla', name: 'Carla Souza' },
  { id: 'diego', name: 'Diego Ramos' },
  { id: 'ana', name: 'Ana Lima' },
  { id: 'felipe', name: 'Felipe Nunes' },
  { id: 'julia', name: 'Júlia Rocha' },
  { id: 'bruno', name: 'Bruno Alves' },
];

// Cada consultor segue um modelo só. A rotina dele é o modelo inteiro.
const MODELS = [
  { id: 'm1', name: 'Consultor da manhã', tasks: [
    { id: 1, t: 450, title: 'Abrir a recepção e conferir a agenda do dia', how: 'Ver as visitas e aulas de hoje e avisar a recepção de quem vem.', days: 'all', active: true },
    { id: 2, t: 480, title: 'Responder o direct do Instagram da academia', how: '', days: 'all', active: true },
    { id: 3, t: 540, title: 'Conferir a limpeza dos vestiários', how: '', days: 'all', active: true },
    { id: 4, t: 660, title: 'Postar o story da aula das 12h', how: 'Foto da turma ou do professor, com o horário e o link do agendamento.', days: [1, 2, 3, 4, 5], active: true },
    { id: 5, t: 750, title: 'Passar o turno para a equipe da tarde', how: 'O que ficou pendente e quem vem à tarde.', days: 'all', active: true },
    { id: 6, t: null, title: 'Revisar as perdas da semana', how: 'Ver os leads perdidos e marcar quem vale tentar de novo.', days: [1, 2], active: true },
  ] },
  { id: 'm2', name: 'Consultor da tarde', tasks: [
    { id: 11, t: 840, title: 'Conferir os contratos assinados do dia', how: '', days: 'all', active: true },
    { id: 12, t: 900, title: 'Organizar a vitrine de suplementos', how: '', days: [2, 4], active: true },
    { id: 13, t: 960, title: 'Responder o direct do Instagram da academia', how: '', days: 'all', active: true },
    { id: 14, t: 1080, title: 'Mandar o resumo do dia no grupo da equipe', how: 'Visitas, aulas e matrículas do dia, em três linhas.', days: 'all', active: true },
    { id: 15, t: 1020, title: 'Organizar o mural de avisos', how: '', days: [5], active: false },
  ] },
  { id: 'm3', name: 'Consultor da noite', tasks: [
    { id: 21, t: 1020, title: 'Conferir a agenda da noite', how: '', days: 'all', active: true },
    { id: 22, t: 1080, title: 'Mandar o resumo do dia no grupo da equipe', how: 'Visitas, aulas e matrículas do dia, em três linhas.', days: 'all', active: true },
    { id: 23, t: 1230, title: 'Fechar o caixa e conferir a recepção', how: '', days: 'all', active: true },
  ] },
];

const ASSIGN = { carla: 'm1', diego: 'm1', ana: 'm2', felipe: 'm2', julia: 'm3', bruno: null };

const DONE = {
  '1:carla': { at: 454 }, '2:carla': { at: 485 }, '3:carla': { at: 548 },
  '1:diego': { at: 452 }, '2:diego': { at: 482 }, '3:diego': { at: 581, note: 'Faltava papel no banheiro, já reposto' },
  '6:diego': { at: 610, note: 'Duas perdas por preço, vale tentar de novo em novembro' },
};

let nextTaskId = 100;
let nextModelId = 4;
let now = 665;
let tab = 'modelos';
let openModel = null;
let layout = 'pessoa';
let selected = null;
let taskForm = null;
let modelForm = null;
let renaming = false;
let confirmDelete = false;
let toastTimer = null;

const pad = (n) => String(n).padStart(2, '0');
const hhmm = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const dur = (m) => (m < 60 ? `${m} min` : `${Math.floor(m / 60)}h${m % 60 ? ` ${m % 60}min` : ''}`);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const first = (p) => p.name.split(' ')[0];
const initials = (p) => p.name.split(' ').map((x) => x[0]).join('');
const person = (id) => PEOPLE.find((p) => p.id === id);
const model = (id) => MODELS.find((m) => m.id === id);
const joinPt = (arr) => (arr.length <= 1 ? arr.join('') : `${arr.slice(0, -1).join(', ')} e ${arr[arr.length - 1]}`);
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const byTime = (a, b) => (a.t ?? 9999) - (b.t ?? 9999);
const isDoneState = (s) => s === 'done' || s === 'doneLate';

const followers = (m) => PEOPLE.filter((p) => ASSIGN[p.id] === m.id);
const modelOfPerson = (pid) => (ASSIGN[pid] ? model(ASSIGN[pid]) : null);
const runsToday = (x) => x.active && (x.days === 'all' || x.days.includes(TODAY));
const todayOf = (pid) => (modelOfPerson(pid)?.tasks || []).filter(runsToday).sort(byTime);

function stateOf(x, pid) {
  const d = DONE[`${x.id}:${pid}`];
  if (d && d.at <= now) return x.t != null && d.at > x.t + TOL ? 'doneLate' : 'done';
  if (x.t == null) return 'open';
  if (now < x.t) return 'later';
  if (now <= x.t + TOL) return 'now';
  return 'late';
}

function metaOf(x, pid, s) {
  const d = DONE[`${x.id}:${pid}`];
  if (s === 'done') return `Feita às ${hhmm(d.at)}`;
  if (s === 'doneLate') return `Feita às ${hhmm(d.at)}, depois do horário`;
  if (s === 'now') return 'É agora';
  if (s === 'late') return `Era às ${hhmm(x.t)}, atrasada há ${dur(now - x.t)}`;
  if (s === 'later') return `Às ${hhmm(x.t)}`;
  return 'Até o fim do dia';
}

function freqText(days) {
  if (days === 'all') return 'Todos os dias de trabalho';
  const sorted = WEEK_ORDER.filter((d) => days.includes(d));
  const idx = sorted.map((d) => WEEK_ORDER.indexOf(d));
  const contiguous = idx.every((v, i) => i === 0 || v === idx[i - 1] + 1);
  if (sorted.length >= 3 && contiguous) return `${cap(DAY_LONG[sorted[0]])} a ${DAY_LONG[sorted[sorted.length - 1]]}`;
  return cap(joinPt(sorted.map((d) => `${DAY_LONG[d]}s`)));
}

const mark = (s) => `<span class="mark">${isDoneState(s) ? ICON.check : ''}</span>`;
const timeOrRepeat = (x) => (x.t != null ? hhmm(x.t) : `<span class="icon-repeat" title="Sem horário">${ICON.repeat}</span>`);

function spanText(m) {
  const timed = m.tasks.filter((x) => x.active && x.t != null).sort(byTime);
  const free = m.tasks.filter((x) => x.active && x.t == null).length;
  const parts = [];
  if (timed.length) parts.push(timed.length === 1 ? `às ${hhmm(timed[0].t)}` : `${hhmm(timed[0].t)} às ${hhmm(timed[timed.length - 1].t)}`);
  if (free) parts.push(`${free} sem horário`);
  return parts.join(' · ');
}

const avatars = (list) => `<span class="stack">${list.map((p) => `<span class="avatar sm" title="${esc(p.name)}">${initials(p)}</span>`).join('')}</span>`;
const pct = (m) => ((Math.min(Math.max(m, DAY_START), DAY_END) - DAY_START) / (DAY_END - DAY_START)) * 100;

function dayline(m) {
  const timed = m.tasks.filter((x) => x.active && x.t != null).sort(byTime);
  const span = timed.length > 1 ? `<span class="span" style="left:${pct(timed[0].t)}%;width:${pct(timed[timed.length - 1].t) - pct(timed[0].t)}%"></span>` : '';
  return `<div class="dayline" aria-hidden="true"><span class="base"></span>${span}${timed.map((x) => `<span class="dot" style="left:${pct(x.t)}%"></span>`).join('')}<span class="hr start" style="left:0">07h</span><span class="hr" style="left:50%">14h</span><span class="hr end" style="left:100%">21h</span></div>`;
}

/* ---------- cabeçalho e abas ---------- */
function subtabs() {
  const none = PEOPLE.filter((p) => !ASSIGN[p.id]).length;
  return `
  <div class="subtabs" role="tablist">
    <button type="button" role="tab" class="subtab" aria-selected="${tab === 'modelos'}" data-tab="modelos">Modelos <span class="n">${MODELS.length}</span></button>
    <button type="button" role="tab" class="subtab" aria-selected="${tab === 'hoje'}" data-tab="hoje">Hoje${none ? ` <span class="n warn" title="Consultores sem modelo">${none} sem modelo</span>` : ''}</button>
  </div>`;
}

function modelsHead() {
  const withModel = PEOPLE.filter((p) => ASSIGN[p.id]).length;
  const none = PEOPLE.filter((p) => !ASSIGN[p.id]);
  const tail = none.length
    ? `. <em class="warn">${joinPt(none.map(first))}</em> ainda ${none.length === 1 ? 'está' : 'estão'} sem rotina`
    : '. Todos têm rotina';
  return `
  <div class="page-head">
    <div>
      <p class="eyebrow">${ICON.list} Rotinas</p>
      <h1><em class="ok t">${withModel} de ${PEOPLE.length}</em> consultores seguem um modelo${tail}.</h1>
    </div>
    <button type="button" class="btn-primary" data-new-model>${ICON.plus}Novo modelo</button>
  </div>${subtabs()}`;
}

function todayHead() {
  const pairs = [];
  PEOPLE.forEach((p) => todayOf(p.id).forEach((x) => pairs.push(stateOf(x, p.id))));
  const done = pairs.filter(isDoneState).length;
  const late = pairs.filter((s) => s === 'late').length;
  const tail = late ? `, e <em class="bad">${late} ${late === 1 ? 'está atrasada' : 'estão atrasadas'}</em>` : '. Nenhuma está atrasada';
  return `
  <div class="page-head">
    <div>
      <p class="eyebrow">${ICON.list} Rotinas · terça, ${hhmm(now)}</p>
      <h1>A equipe fez <em class="ok t">${done} de ${pairs.length}</em> tarefas da rotina até agora${tail}.</h1>
    </div>
  </div>${subtabs()}`;
}

/* ---------- Modelos ---------- */
// Em cima, um cartão por modelo: abrir e mudar vale para todo mundo que segue
// aquele modelo. Embaixo, a lista de consultores diz quem segue qual.
function modelsView() {
  const cards = MODELS.map((m) => {
    const fol = followers(m);
    const active = m.tasks.filter((x) => x.active).length;
    return `
    <button type="button" class="card mcard" data-open-model="${m.id}">
      <div class="mcard-top">
        <div><h3>${esc(m.name)}</h3><p class="mcard-sub t">${active} ${active === 1 ? 'tarefa' : 'tarefas'}${spanText(m) ? ` · ${spanText(m)}` : ''}</p></div>
        <span class="mcard-open">Abrir</span>
      </div>
      ${dayline(m)}
      <div class="mcard-people ${fol.length ? '' : 'none'}">${fol.length ? `${avatars(fol)}<span>${joinPt(fol.map(first))}</span>` : 'Ninguém segue este modelo'}</div>
    </button>`;
  }).join('');
  const rows = PEOPLE.map((p) => {
    const m = modelOfPerson(p.id);
    const today = m ? m.tasks.filter(runsToday).length : 0;
    return `
    <div class="prow-assign ${m ? '' : 'none'}">
      <span class="avatar">${initials(p)}</span>
      <div class="who"><b>${esc(p.name)}</b><small class="t">${m ? `${today} ${today === 1 ? 'tarefa' : 'tarefas'} hoje${spanText(m) ? ` · ${spanText(m)}` : ''}` : 'Sem rotina na Meta diária'}</small></div>
      <select class="select" data-assign="${p.id}" aria-label="Modelo que ${esc(first(p))} segue">
        <option value="" ${m ? '' : 'selected'}>Sem modelo</option>
        ${MODELS.map((x) => `<option value="${x.id}" ${m?.id === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}
      </select>
      <span class="go">${m ? `<button type="button" class="link" data-open-model="${m.id}">Abrir modelo</button>` : ''}</span>
    </div>`;
  }).join('');
  return `
  ${modelsHead()}
  <div class="models">${cards}</div>
  <div class="section-title"><h2>Consultores</h2><p>Cada um segue um modelo. Trocar aqui muda a rotina da pessoa a partir de hoje.</p></div>
  <section class="card people-card">${rows}</section>`;
}

/* ---------- dentro de um modelo ---------- */
function taskRow(x) {
  return `
  <div class="mtask ${x.active ? '' : 'paused'}">
    <span class="time t">${timeOrRepeat(x)}</span>
    <span class="node"></span>
    <div>
      <p class="title">${esc(x.title)}</p>
      ${x.how ? `<p class="how">${esc(x.how)}</p>` : ''}
      <p class="when">${freqText(x.days)}${x.active ? '' : ' <span class="pill">Pausada</span>'}</p>
    </div>
    <button type="button" class="btn-ghost" data-edit-task="${x.id}">Editar</button>
  </div>`;
}

function modelView() {
  const m = model(openModel);
  const fol = followers(m);
  const timed = m.tasks.filter((x) => x.t != null).sort((a, b) => (Number(b.active) - Number(a.active)) || byTime(a, b));
  const free = m.tasks.filter((x) => x.t == null);
  const others = PEOPLE.filter((p) => ASSIGN[p.id] !== m.id);
  const title = renaming
    ? `<input class="rename-input" id="rename" value="${esc(m.name)}" aria-label="Nome do modelo" maxlength="40"> <button type="button" class="btn-primary" data-save-name>Salvar nome</button>`
    : `${esc(m.name)} <button type="button" class="rename" data-rename>Renomear</button>`;
  return `
  <p class="crumb"><button type="button" data-back>Modelos</button><span>/</span><span>${esc(m.name)}</span></p>
  <div class="model-head">
    <h1>${title}</h1>
    <div class="model-actions">
      <button type="button" class="btn-ghost" data-duplicate>${ICON.copy}Duplicar modelo</button>
      <button type="button" class="btn-danger" data-ask-delete>Excluir modelo</button>
    </div>
  </div>
  ${confirmDelete ? `
  <div class="confirm" role="alert">
    <span>${fol.length ? `${joinPt(fol.map(first))} ${fol.length === 1 ? 'fica' : 'ficam'} sem rotina até você escolher outro modelo.` : 'Ninguém segue este modelo.'} O histórico dos dias anteriores continua.</span>
    <span style="display:flex;gap:6px"><button type="button" class="btn-ghost" data-cancel-delete>Cancelar</button><button type="button" class="btn-danger solid" data-delete-model>Excluir modelo</button></span>
  </div>` : ''}
  <div class="model-grid">
    <section class="card">
      <div class="box-head"><h2>Tarefas <span class="n">${m.tasks.filter((x) => x.active).length}</span></h2><button type="button" class="btn-primary" data-new-task>${ICON.plus}Nova tarefa</button></div>
      ${m.tasks.length ? `
        ${timed.length ? `<div class="mtasks">${timed.map(taskRow).join('')}</div>` : ''}
        ${free.length ? `<div class="mtasks-free"><p class="lbl">Sem horário</p><div class="mtasks">${free.map(taskRow).join('')}</div></div>` : ''}`
        : '<p class="empty">Este modelo ainda não tem tarefa. Crie a primeira.</p>'}
    </section>
    <aside>
      <section class="card">
        <div class="box-head"><h2>Quem segue <span class="n">${fol.length}</span></h2></div>
        <div class="followers">
          ${fol.length ? fol.map((p) => `<div class="follower"><span class="avatar">${initials(p)}</span><b>${esc(p.name)}</b><button type="button" data-unassign="${p.id}">Tirar</button></div>`).join('') : '<p class="hint">Ninguém segue este modelo ainda.</p>'}
          ${others.length ? `
          <select class="select add-follower" data-add-follower aria-label="Pôr um consultor neste modelo">
            <option value="">Pôr um consultor neste modelo</option>
            ${others.map((p) => `<option value="${p.id}">${esc(p.name)}${ASSIGN[p.id] ? ` (sai do ${esc(model(ASSIGN[p.id]).name)})` : ' (sem modelo)'}</option>`).join('')}
          </select>` : ''}
        </div>
      </section>
      <p class="version-note">${ICON.info}<span>O que você muda aqui vale a partir de hoje para quem segue o modelo. Os dias anteriores continuam como estavam no histórico.</span></p>
    </aside>
  </div>`;
}

/* ---------- Hoje ---------- */
function peopleCards() {
  const pneedle = `<div class="pneedle" aria-hidden="true"><span>${hhmm(now)}</span><span></span></div>`;
  return `<div class="people-grid">${PEOPLE.map((p) => {
    const m = modelOfPerson(p.id);
    if (!m) {
      return `
      <section class="card" aria-label="${esc(p.name)}">
        <div class="pcard-head"><span class="avatar">${initials(p)}</span><div><b>${esc(p.name)}</b></div></div>
        <div class="pcard-none"><span>Sem modelo. A Meta diária não mostra rotina para essa pessoa.</span><button type="button" class="btn-ghost" data-tab="modelos">Escolher modelo</button></div>
      </section>`;
    }
    const mine = todayOf(p.id);
    const states = mine.map((x) => stateOf(x, p.id));
    const d = states.filter(isDoneState).length;
    let rows = '';
    let placed = false;
    mine.forEach((x) => {
      const s = stateOf(x, p.id);
      if (!placed && (x.t == null || x.t > now)) { rows += pneedle; placed = true; }
      const key = `${x.id}:${p.id}`;
      const hasNote = DONE[key]?.note && isDoneState(s);
      rows += `<button type="button" class="prow is-${s}" data-cell="${key}" aria-pressed="${selected === key}">
        <span class="task-time t">${timeOrRepeat(x)}</span>
        ${mark(s)}
        <span><span class="ptitle">${esc(x.title)}</span><small>${esc(metaOf(x, p.id, s))}${hasNote ? ' · com observação' : ''}</small></span>
      </button>`;
    });
    if (!placed) rows += pneedle;
    return `
    <section class="card" aria-label="${esc(p.name)}">
      <div class="pcard-head"><span class="avatar">${initials(p)}</span>
        <div><b>${esc(p.name)}</b><button type="button" class="model-link" data-open-model="${m.id}">${esc(m.name)}</button></div>
        <div class="count"><div class="t"><b>${d}</b> de ${mine.length}</div><div class="segs" style="justify-content:flex-end;margin-top:4px">${states.map((s) => `<i class="seg ${s}"></i>`).join('')}</div></div>
      </div>
      <div class="plist">${rows}</div>
    </section>`;
  }).join('')}</div>`;
}

const needleRow = (cols) => `<tr class="needle" aria-hidden="true"><td class="col-task"><span class="needle-line"></span><span class="needle-tag">${hhmm(now)}</span></td><td colspan="${cols}"><span class="needle-line"></span></td></tr>`;

function board() {
  const ppl = PEOPLE.filter((p) => ASSIGN[p.id]);
  const rows = [];
  MODELS.forEach((m) => m.tasks.filter(runsToday).forEach((x) => { if (followers(m).length) rows.push({ x, m }); }));
  rows.sort((a, b) => byTime(a.x, b.x));
  const timed = rows.filter((r) => r.x.t != null);
  const free = rows.filter((r) => r.x.t == null);
  const headCells = ppl.map((p) => {
    const mine = todayOf(p.id);
    const states = mine.map((x) => stateOf(x, p.id));
    return `<th scope="col"><div class="person"><span class="avatar">${initials(p)}</span><b>${first(p)}</b><span class="t">${states.filter(isDoneState).length} de ${mine.length}</span><span class="segs">${states.map((s) => `<i class="seg ${s}"></i>`).join('')}</span></div></th>`;
  }).join('');
  const rowHtml = ({ x, m }) => {
    const cells = ppl.map((p) => {
      if (ASSIGN[p.id] !== m.id) return `<td><span class="na"></span><span class="sr">${esc(first(p))} não faz</span></td>`;
      const s = stateOf(x, p.id);
      const key = `${x.id}:${p.id}`;
      const txt = `${first(p)}: ${metaOf(x, p.id, s)}`;
      return `<td class="is-${s}"><button type="button" class="cell-btn" data-cell="${key}" aria-pressed="${selected === key}" aria-label="${esc(x.title)}. ${esc(txt)}" title="${esc(txt)}">${mark(s)}</button></td>`;
    }).join('');
    return `<tr><th scope="row" class="col-task"><div class="task-cell"><span class="task-time t">${timeOrRepeat(x)}</span><div><p class="task-title">${esc(x.title)}</p><p class="task-who">${esc(m.name)}</p></div></div></th>${cells}</tr>`;
  };
  let body = '';
  let placed = false;
  timed.forEach((r) => {
    if (!placed && r.x.t > now) { body += needleRow(ppl.length); placed = true; }
    body += rowHtml(r);
  });
  if (!placed) body += needleRow(ppl.length);
  if (free.length) body += `<tr class="free-head"><td class="col-task">Sem horário</td><td colspan="${ppl.length}"></td></tr>${free.map(rowHtml).join('')}`;
  return `
  <section class="card board-card" aria-label="Quadro da rotina de hoje">
    <div class="board-wrap"><table class="board"><thead><tr><th scope="col" class="col-task">Tarefa</th>${headCells}</tr></thead><tbody>${body}</tbody></table></div>
  </section>`;
}

function aside() {
  const all = [];
  PEOPLE.forEach((p) => todayOf(p.id).forEach((x) => all.push({ x, p, s: stateOf(x, p.id) })));
  const late = all.filter((r) => r.s === 'late').sort((a, b) => a.x.t - b.x.t);
  const notes = all.filter((r) => isDoneState(r.s) && DONE[`${r.x.id}:${r.p.id}`]?.note);
  let detail = '';
  if (selected) {
    const [tid, pid] = selected.split(':');
    const p = person(pid);
    const x = modelOfPerson(pid)?.tasks.find((t) => t.id === Number(tid));
    if (x && p) {
      const s = stateOf(x, pid);
      const note = isDoneState(s) ? DONE[selected]?.note : null;
      detail = `
      <section class="card aside-card detail" aria-live="polite">
        <div class="detail-top"><p class="eyebrow">Detalhe</p><button type="button" class="detail-x" data-close-detail>Fechar</button></div>
        <div class="aside-list"><div class="aside-row"><span class="avatar">${initials(p)}</span><p><b>${esc(p.name)}</b><small>${esc(x.title)}</small><small class="${s === 'late' ? 'bad' : ''}">${esc(metaOf(x, pid, s))}</small>${note ? `<span class="quote">${esc(note)}</span>` : ''}</p></div></div>
      </section>`;
    }
  }
  return `
  <div class="aside">
    ${detail}
    <section class="card aside-card">
      <h3>Atrasadas agora <span class="n ${late.length ? '' : 'neutral'}">${late.length}</span></h3>
      ${late.length ? `<div class="aside-list">${late.map((r) => `<div class="aside-row"><span class="avatar">${initials(r.p)}</span><p><b>${esc(first(r.p))}</b> · ${esc(r.x.title)}<small class="bad">Era às ${hhmm(r.x.t)}, há ${dur(now - r.x.t)}</small></p></div>`).join('')}</div>` : '<p class="aside-empty">Ninguém com tarefa atrasada.</p>'}
    </section>
    <section class="card aside-card">
      <h3>Observações de hoje <span class="n neutral">${notes.length}</span></h3>
      ${notes.length ? `<div class="aside-list">${notes.map((r) => { const d = DONE[`${r.x.id}:${r.p.id}`]; return `<div class="aside-row"><span class="avatar">${initials(r.p)}</span><p><b>${esc(first(r.p))}</b> · ${esc(r.x.title)}<small>Às ${hhmm(d.at)}</small><span class="quote">${esc(d.note)}</span></p></div>`; }).join('')}</div>` : '<p class="aside-empty">Nenhuma observação até agora.</p>'}
    </section>
  </div>`;
}

const todayView = () => `${todayHead()}<div class="today"><div>${layout === 'quadro' ? board() : peopleCards()}</div>${aside()}</div>`;

/* ---------- painel da tarefa ---------- */
function openTaskForm(task) {
  taskForm = task
    ? { id: task.id, title: task.title, how: task.how || '', daysMode: task.days === 'all' ? 'all' : 'week', days: new Set(task.days === 'all' ? [1, 2, 3, 4, 5] : task.days), timeMode: task.t == null ? 'none' : 'time', time: task.t == null ? '09:00' : hhmm(task.t), active: task.active, errors: {} }
    : { id: null, title: '', how: '', daysMode: 'all', days: new Set([1, 2, 3, 4, 5]), timeMode: 'time', time: '09:00', active: true, errors: {} };
  renderOverlay('f-title');
}

function taskSheet() {
  const f = taskForm;
  const m = model(openModel);
  const fol = followers(m);
  const editing = f.id != null;
  const whoSees = fol.length ? `${joinPt(fol.map(first))} ${fol.length === 1 ? 'vê' : 'veem'} a mudança na Meta diária a partir de hoje.` : 'Ninguém segue este modelo ainda.';
  return `
  <div class="backdrop" data-close></div>
  <aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <div><h2 id="sheet-title">${editing ? 'Editar tarefa' : 'Nova tarefa'}</h2><p>No modelo ${esc(m.name)}. ${whoSees}</p></div>
      <button type="button" class="btn-ghost" data-close>Fechar</button>
    </div>
    <div class="sheet-body">
      <label class="field"><span class="lbl">Nome da tarefa</span>
        <input class="input" id="f-title" maxlength="80" value="${esc(f.title)}" placeholder="Ex.: Conferir a agenda do dia na recepção" aria-invalid="${Boolean(f.errors.title)}">
        ${f.errors.title ? `<span class="err">${f.errors.title}</span>` : ''}
      </label>
      <label class="field"><span class="lbl">Como fazer <span>(opcional)</span></span>
        <textarea class="textarea" id="f-how" maxlength="240" placeholder="O que o consultor precisa saber para fazer do jeito certo.">${esc(f.how)}</textarea>
      </label>
      <div class="field" role="group" aria-labelledby="l-days"><span class="lbl" id="l-days">Em que dias</span>
        <div class="seg-ctl">
          <button type="button" aria-pressed="${f.daysMode === 'all'}" data-set="daysMode:all">Todos os dias de trabalho</button>
          <button type="button" aria-pressed="${f.daysMode === 'week'}" data-set="daysMode:week">Dias da semana</button>
        </div>
        ${f.daysMode === 'week' ? `<div class="days">${WEEK_ORDER.map((d) => `<button type="button" aria-pressed="${f.days.has(d)}" data-day="${d}" aria-label="${DAY_LONG[d]}">${DAY_NAMES[d]}</button>`).join('')}</div>` : '<span class="hint">Os dias da Meta da academia, definidos em Configurações.</span>'}
        ${f.errors.days ? `<span class="err">${f.errors.days}</span>` : ''}
      </div>
      <div class="field" role="group" aria-labelledby="l-time"><span class="lbl" id="l-time">Horário</span>
        <div class="seg-ctl">
          <button type="button" aria-pressed="${f.timeMode === 'time'}" data-set="timeMode:time">Com horário</button>
          <button type="button" aria-pressed="${f.timeMode === 'none'}" data-set="timeMode:none">Sem horário</button>
        </div>
        ${f.timeMode === 'time' ? `<input class="input time-input" id="f-time" type="time" value="${f.time}" aria-label="Horário da tarefa"><span class="hint">Até 30 minutos depois do horário ela aparece como "agora". Depois disso, como atrasada.</span>` : '<span class="hint">Vale até o fim do dia.</span>'}
        ${f.errors.time ? `<span class="err">${f.errors.time}</span>` : ''}
      </div>
    </div>
    <div class="sheet-foot">
      ${editing ? `<div class="left"><button type="button" class="btn-ghost" data-toggle-active>${f.active ? 'Pausar tarefa' : 'Reativar tarefa'}</button><button type="button" class="btn-danger" data-delete-task>Excluir tarefa</button></div>` : ''}
      <div class="right"><button type="button" class="btn-ghost" data-close>Cancelar</button><button type="button" class="btn-primary" data-save-task>${editing ? 'Salvar alterações' : 'Criar tarefa'}</button></div>
    </div>
  </aside>`;
}

function syncTask() {
  if (!taskForm) return;
  const t = document.getElementById('f-title');
  const h = document.getElementById('f-how');
  const tm = document.getElementById('f-time');
  if (t) taskForm.title = t.value;
  if (h) taskForm.how = h.value;
  if (tm) taskForm.time = tm.value;
}

function saveTask() {
  syncTask();
  const f = taskForm;
  f.errors = {};
  if (!f.title.trim()) f.errors.title = 'Escreva o nome da tarefa.';
  if (f.daysMode === 'week' && f.days.size === 0) f.errors.days = 'Escolha pelo menos um dia.';
  if (f.timeMode === 'time' && !/^\d{2}:\d{2}$/.test(f.time)) f.errors.time = 'Escolha o horário.';
  if (Object.keys(f.errors).length) { renderOverlay('error'); return; }
  const [h, mi] = (f.time || '00:00').split(':').map(Number);
  const data = { title: f.title.trim(), how: f.how.trim(), days: f.daysMode === 'all' ? 'all' : WEEK_ORDER.filter((d) => f.days.has(d)), t: f.timeMode === 'time' ? h * 60 + mi : null, active: f.active };
  const m = model(openModel);
  if (f.id == null) { m.tasks.push({ id: nextTaskId++, ...data }); showToast('Tarefa criada.'); }
  else { Object.assign(m.tasks.find((x) => x.id === f.id), data); showToast('Alterações salvas.'); }
  taskForm = null;
  renderOverlay();
  render();
}

/* ---------- painel do modelo novo ---------- */
function modelSheet() {
  const f = modelForm;
  return `
  <div class="backdrop" data-close></div>
  <aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="msheet-title">
    <div class="sheet-head">
      <div><h2 id="msheet-title">Novo modelo</h2><p>Depois de criar, você põe as tarefas dentro dele.</p></div>
      <button type="button" class="btn-ghost" data-close>Fechar</button>
    </div>
    <div class="sheet-body">
      <label class="field"><span class="lbl">Nome do modelo</span>
        <input class="input" id="m-name" maxlength="40" value="${esc(f.name)}" placeholder="Ex.: Consultor do fim de semana" aria-invalid="${Boolean(f.errors.name)}">
        ${f.errors.name ? `<span class="err">${f.errors.name}</span>` : ''}
      </label>
      <div class="field" role="group" aria-labelledby="l-start"><span class="lbl" id="l-start">Começar</span>
        <div class="seg-ctl">
          <button type="button" aria-pressed="${f.from === ''}" data-mset="from:">Em branco</button>
          <button type="button" aria-pressed="${f.from !== ''}" data-mset="from:${MODELS[0]?.id || ''}">Cópia de um modelo</button>
        </div>
        ${f.from !== '' ? `<select class="select" id="m-from" aria-label="Modelo para copiar">${MODELS.map((x) => `<option value="${x.id}" ${f.from === x.id ? 'selected' : ''}>${esc(x.name)} (${x.tasks.length} tarefas)</option>`).join('')}</select><span class="hint">As tarefas são copiadas. Mudar a cópia não mexe no original.</span>` : ''}
      </div>
      <div class="field" role="group" aria-labelledby="l-fol"><span class="lbl" id="l-fol">Quem segue <span>(opcional, dá para escolher depois)</span></span>
        <div class="pick">${PEOPLE.map((p) => `<label><input type="checkbox" data-mfol="${p.id}" ${f.fol.has(p.id) ? 'checked' : ''}><span class="avatar sm">${initials(p)}</span>${esc(p.name)}<small>${ASSIGN[p.id] ? `sai do ${esc(model(ASSIGN[p.id]).name)}` : 'sem modelo'}</small></label>`).join('')}</div>
      </div>
    </div>
    <div class="sheet-foot"><div class="right"><button type="button" class="btn-ghost" data-close>Cancelar</button><button type="button" class="btn-primary" data-save-model>Criar modelo</button></div></div>
  </aside>`;
}

function saveModel() {
  const f = modelForm;
  f.name = document.getElementById('m-name').value;
  const fromSel = document.getElementById('m-from');
  if (fromSel) f.from = fromSel.value;
  f.errors = {};
  if (!f.name.trim()) f.errors.name = 'Escreva o nome do modelo.';
  else if (MODELS.some((m) => m.name.toLowerCase() === f.name.trim().toLowerCase())) f.errors.name = 'Já existe um modelo com esse nome.';
  if (Object.keys(f.errors).length) { renderOverlay('m-name'); return; }
  const src = f.from ? model(f.from) : null;
  const m = { id: `m${nextModelId++}`, name: f.name.trim(), tasks: src ? src.tasks.map((x) => ({ ...x, id: nextTaskId++, days: x.days === 'all' ? 'all' : [...x.days] })) : [] };
  MODELS.push(m);
  f.fol.forEach((pid) => { ASSIGN[pid] = m.id; });
  modelForm = null;
  openModel = m.id;
  tab = 'modelos';
  showToast('Modelo criado.');
  renderOverlay();
  render();
}

/* ---------- render ---------- */
const $ = (id) => document.getElementById(id);

function renderOverlay(focus = null) {
  const o = $('overlay');
  o.innerHTML = taskForm ? taskSheet() : modelForm ? modelSheet() : '';
  if (focus === 'error') o.querySelector('.err')?.closest('.field')?.querySelector('input, button')?.focus();
  else if (focus) $(focus)?.focus();
}

function render() {
  $('layout-tabs').innerHTML = [['pessoa', 'Hoje por pessoa'], ['quadro', 'Hoje em quadro']]
    .map(([id, label]) => `<button type="button" class="tab" aria-pressed="${layout === id}" data-layout="${id}">${label}</button>`).join('');
  $('clock-out').textContent = hhmm(now);
  const dark = document.documentElement.dataset.theme === 'dark';
  $('theme').innerHTML = `${dark ? ICON.sun : ICON.moon}${dark ? 'Tema claro' : 'Tema escuro'}`;
  $('page').innerHTML = tab === 'hoje' ? todayView() : openModel ? modelView() : modelsView();
  if (renaming) $('rename')?.focus();
}

function showToast(msg) {
  let el = $('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2800);
}

function assign(pid, mid) {
  ASSIGN[pid] = mid || null;
  const p = person(pid);
  showToast(mid ? `${first(p)} agora segue o modelo ${model(mid).name}.` : `${first(p)} ficou sem modelo.`);
  render();
}

$('layout-tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-layout]');
  if (b) { layout = b.dataset.layout; tab = 'hoje'; render(); }
});

$('page').addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab]');
  if (t) { tab = t.dataset.tab; openModel = null; renaming = false; confirmDelete = false; render(); return; }
  const om = e.target.closest('[data-open-model]');
  if (om) { tab = 'modelos'; openModel = om.dataset.openModel; renaming = false; confirmDelete = false; render(); window.scrollTo(0, 0); return; }
  if (e.target.closest('[data-back]')) { openModel = null; renaming = false; confirmDelete = false; render(); return; }
  if (e.target.closest('[data-new-model]')) { modelForm = { name: '', from: '', fol: new Set(), errors: {} }; renderOverlay('m-name'); return; }
  if (e.target.closest('[data-new-task]')) { openTaskForm(null); return; }
  const et = e.target.closest('[data-edit-task]');
  if (et) { openTaskForm(model(openModel).tasks.find((x) => x.id === Number(et.dataset.editTask))); return; }
  if (e.target.closest('[data-rename]')) { renaming = true; render(); return; }
  if (e.target.closest('[data-save-name]')) {
    const v = $('rename').value.trim();
    if (v) { model(openModel).name = v; showToast('Nome salvo.'); }
    renaming = false; render(); return;
  }
  if (e.target.closest('[data-duplicate]')) {
    const src = model(openModel);
    const copy = { id: `m${nextModelId++}`, name: `Cópia de ${src.name}`, tasks: src.tasks.map((x) => ({ ...x, id: nextTaskId++, days: x.days === 'all' ? 'all' : [...x.days] })) };
    MODELS.push(copy);
    openModel = copy.id; renaming = true;
    showToast('Modelo duplicado. Dê um nome e escolha quem segue.');
    render(); return;
  }
  if (e.target.closest('[data-ask-delete]')) { confirmDelete = true; render(); return; }
  if (e.target.closest('[data-cancel-delete]')) { confirmDelete = false; render(); return; }
  if (e.target.closest('[data-delete-model]')) {
    const m = model(openModel);
    followers(m).forEach((p) => { ASSIGN[p.id] = null; });
    MODELS.splice(MODELS.indexOf(m), 1);
    openModel = null; confirmDelete = false;
    showToast('Modelo excluído. O histórico continua com ele.');
    render(); return;
  }
  const un = e.target.closest('[data-unassign]');
  if (un) { assign(un.dataset.unassign, null); return; }
  const c = e.target.closest('[data-cell]');
  if (c) { selected = selected === c.dataset.cell ? null : c.dataset.cell; render(); return; }
  if (e.target.closest('[data-close-detail]')) { selected = null; render(); }
});

$('page').addEventListener('change', (e) => {
  const a = e.target.closest('[data-assign]');
  if (a) { assign(a.dataset.assign, a.value); return; }
  const add = e.target.closest('[data-add-follower]');
  if (add && add.value) assign(add.value, openModel);
});

$('page').addEventListener('keydown', (e) => {
  if (e.target.id === 'rename' && e.key === 'Enter') $('page').querySelector('[data-save-name]').click();
  if (e.target.id === 'rename' && e.key === 'Escape') { renaming = false; render(); }
});

$('overlay').addEventListener('click', (e) => {
  if (e.target.closest('[data-close]')) { taskForm = null; modelForm = null; renderOverlay(); return; }
  const set = e.target.closest('[data-set]');
  if (set) { syncTask(); const [k, v] = set.dataset.set.split(':'); taskForm[k] = v; taskForm.errors = {}; renderOverlay(); return; }
  const day = e.target.closest('[data-day]');
  if (day) { syncTask(); const d = Number(day.dataset.day); if (taskForm.days.has(d)) taskForm.days.delete(d); else taskForm.days.add(d); renderOverlay(); return; }
  if (e.target.closest('[data-save-task]')) { saveTask(); return; }
  if (e.target.closest('[data-toggle-active]')) {
    syncTask();
    taskForm.active = !taskForm.active;
    model(openModel).tasks.find((x) => x.id === taskForm.id).active = taskForm.active;
    showToast(taskForm.active ? 'Tarefa reativada.' : 'Tarefa pausada.');
    renderOverlay(); render(); return;
  }
  if (e.target.closest('[data-delete-task]')) {
    const list = model(openModel).tasks;
    list.splice(list.findIndex((x) => x.id === taskForm.id), 1);
    taskForm = null;
    showToast('Tarefa excluída. O histórico continua com ela.');
    renderOverlay(); render(); return;
  }
  const ms = e.target.closest('[data-mset]');
  if (ms) { modelForm.name = $('m-name').value; modelForm.from = ms.dataset.mset.split(':')[1]; renderOverlay(); return; }
  if (e.target.closest('[data-save-model]')) saveModel();
});

$('overlay').addEventListener('change', (e) => {
  const fo = e.target.closest('[data-mfol]');
  if (fo) { if (fo.checked) modelForm.fol.add(fo.dataset.mfol); else modelForm.fol.delete(fo.dataset.mfol); }
  if (e.target.id === 'm-from') modelForm.from = e.target.value;
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && (taskForm || modelForm)) { taskForm = null; modelForm = null; renderOverlay(); }
});

$('clock').addEventListener('input', (e) => { now = Number(e.target.value); render(); });
$('theme').addEventListener('click', () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark';
  render();
});

render();
</script>
</body>
</html>
