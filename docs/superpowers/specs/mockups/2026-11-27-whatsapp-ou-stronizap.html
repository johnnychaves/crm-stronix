<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsApp ou Stronizap</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="2026-11-27-meta-professor.css">
<style>
/* As duas saídas da conversa, WhatsApp e Stronizap, para a academia com o
   Stronizap ligado (27/11/2026). Três jeitos de mostrar, no bloco Agora da
   Meta e no cabeçalho da ficha. Dados inventados. Nada daqui vai para o app. */
.wrap{max-width:900px}
.vers{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:12.5px;color:var(--muted)}
.vers button{height:32px;padding:0 14px;border-radius:999px;border:1px dashed var(--faint);background:transparent;font-size:13px;font-weight:600;cursor:pointer}
.vers button[aria-pressed=true]{border-style:solid;border-color:var(--ink);background:var(--ink);color:#fff}
.expl{margin:6px 0 18px;font-size:13.5px;color:var(--ink2);max-width:72ch}
.rotulo{margin:22px 0 8px;font-size:12px;font-weight:600;color:var(--muted)}

/* bloco Agora (visual do PR #332) */
.agora{padding:20px 24px 16px;border-radius:18px;background:#fff;border:1px solid var(--line);border-left:6px solid #F43F5E}
.ag-t{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.ag-t .rot{font-size:13px;font-weight:600;color:var(--blue700)}
.mot{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;background:rgba(244,63,94,.10);color:var(--rose700);font-size:12.5px;font-weight:600}
.cat{font-size:13px;color:var(--muted)}
.corpo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;margin-top:14px}
.foto{display:inline-grid;padding:3px;border-radius:50%;background:#F43F5E;align-self:start}
.foto .av{border:3px solid #fff}
.corpo h2{font-size:26px;font-weight:700;letter-spacing:-.02em}
.frase{margin-top:6px;font-size:17px;color:var(--ink2)}
.frase b{color:var(--rose700)}
.linha{display:flex;gap:6px 22px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.linha b{color:var(--ink);font-weight:600}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.pe{display:flex;gap:20px;margin-top:12px;font-size:13px;font-weight:600;color:var(--muted)}

/* botões */
.p{position:relative;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.p:hover{border-color:var(--blue200)}
.p.main{background:var(--blue);border-color:var(--blue);color:#fff}
.p.wa{color:#047857}
.p.zap{color:#0E1A40}
kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border:1px solid currentColor;border-radius:5px;font:600 11px Geist,sans-serif;opacity:.55}
.split{position:relative;display:inline-flex}
.split .p:first-child{border-radius:999px 0 0 999px;padding-right:12px}
.split .p:nth-child(2){border-radius:0 999px 999px 0;margin-left:-1px;padding:0 10px}
.menu{position:absolute;top:calc(100% + 6px);left:0;z-index:20;min-width:280px;padding:6px;border-radius:14px;border:1px solid var(--line);background:#fff;box-shadow:0 14px 34px -12px rgba(14,26,64,.3);text-align:left}
.menu.r{left:auto;right:0}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:10px;background:transparent;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink);text-align:left}
.mi:hover{background:#f4f7fd}
.mi small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.mi kbd{margin-left:auto}
.mi .ic{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#f1f5f9;flex:none}
.mi .ic.wa{background:rgba(16,185,129,.12);color:#047857}
.sep{height:1px;margin:4px 6px;background:var(--rule)}
.lembra{padding:6px 10px 4px;font-size:11.5px;color:var(--muted)}

/* cabeçalho da ficha (resumo) */
.ficha{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 22px;border-radius:18px;background:#fff;border:1px solid var(--line)}
.ficha h2{font-size:22px;font-weight:700;letter-spacing:-.02em}
.ficha .st{font-size:12.5px;color:#047857;font-weight:600}
.ficha .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ficha .p.cheio{background:#10B981;border-color:#10B981;color:#fff}

.nota{margin-top:26px;padding:14px 18px;border-radius:14px;background:var(--blue50);color:var(--blue700);font-size:13px}
.nota b{font-weight:700}
</style></head><body><div class="wrap" id="app"></div>
<div class="tag">Mockup · WhatsApp ou Stronizap · dados de exemplo</div>
<script>
const WA = '<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3Z"/></svg>';
const ZAP = (s = 16) => `<svg viewBox="0 0 240 240" width="${s}" height="${s}"><path fill="#1A1D20" d="M 120 30 C 70 30, 30 70, 30 120 C 30 148, 43.5 173.5, 64 190.5 C 61 201, 56.5 213, 50.5 222 C 49 224, 51 226, 53 225 C 64 222, 79 217, 92 211 C 101 213, 110 214, 120 214 C 170 214, 210 173, 210 122 C 210 71, 170 30, 120 30 Z"/><path fill="#25D366" stroke="#25D366" stroke-width="8" stroke-linejoin="round" d="M 138 56 L 84 132 L 116 132 L 102 184 L 156 108 L 124 108 Z"/></svg>`;
const SETA = '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>';
const FONE = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>';

const OPCOES = {
  a: { nome: 'A · Dois botões', expl: 'WhatsApp e Stronizap lado a lado, cada um com a sua tecla (W e Z). Um clique e vai, sem menu. Ocupa mais espaço na linha de ações.' },
  b: { nome: 'B · Botão com seta', expl: 'Um botão só. O clique abre o caminho que a pessoa usou por último, lembrado em cada computador, e a seta ao lado abre as duas opções. A tecla W segue o último caminho.' },
  c: { nome: 'C · Botão Conversar', expl: 'Um botão "Conversar" que sempre abre o menu com WhatsApp e Stronizap. Um clique a mais toda vez, mas a escolha fica sempre à vista.' },
};
let op = (location.hash.slice(1) in OPCOES) ? location.hash.slice(1) : 'a';
let menu = null; // 'agora' | 'ficha'
let ultimo = 'zap';

const itemWa = '<button class="mi" data-ir="wa"><span class="ic wa">' + WA + '</span><span>WhatsApp<small>Abre o WhatsApp do computador ou do celular</small></span><kbd>W</kbd></button>';
const itemZap = '<button class="mi" data-ir="zap"><span class="ic">' + ZAP(18) + '</span><span>Stronizap<small>Abre a conversa no Stronizap, com o histórico</small></span><kbd>Z</kbd></button>';

function conversa(onde, cheio = false) {
  const cls = onde === 'ficha' && cheio ? ' cheio' : '';
  const abre = menu === onde;
  const lista = `<div class="menu${onde === 'ficha' ? ' r' : ''}" role="menu">${itemWa}${itemZap}${op === 'b' ? '<div class="sep"></div><p class="lembra">O botão lembra o último caminho que você usou.</p>' : ''}</div>`;
  if (op === 'a') {
    return `<button class="p wa${cls}">${WA}WhatsApp <kbd>W</kbd></button><button class="p zap">${ZAP()}Stronizap <kbd>Z</kbd></button>`;
  }
  if (op === 'b') {
    const rot = ultimo === 'zap' ? `${ZAP()}Stronizap` : `${WA}WhatsApp`;
    return `<span class="split"><button class="p ${ultimo === 'zap' ? 'zap' : 'wa'}${ultimo === 'wa' ? cls : ''}">${rot} <kbd>W</kbd></button><button class="p" data-menu="${onde}" aria-label="Escolher WhatsApp ou Stronizap" aria-expanded="${abre}">${SETA}</button>${abre ? lista : ''}</span>`;
  }
  return `<span style="position:relative"><button class="p wa${cls}" data-menu="${onde}" aria-expanded="${abre}">${WA}Conversar ${SETA}</button>${abre ? lista : ''}</span>`;
}

function render() {
  document.getElementById('app').innerHTML = `
    <div class="vers"><span>Como mostrar:</span>${Object.entries(OPCOES).map(([k, o]) => `<button data-op="${k}" aria-pressed="${op === k}">${o.nome}</button>`).join('')}</div>
    <p class="expl">${OPCOES[op].expl}</p>

    <p class="rotulo">Na Meta diária, bloco Agora</p>
    <section class="agora">
      <div class="ag-t"><span class="rot">Agora</span><span class="mot">4 dias de atraso, crítico</span><span class="cat">Atrasado</span></div>
      <div class="corpo"><span class="foto"><span class="av" style="--s:64px">CM</span></span><div>
        <h2 class="d">Carla Menezes</h2>
        <p class="frase">O contato está atrasado há <b>4 dias</b>.</p>
        <div class="linha"><span><b class="num">(51) 99655-0182</b></span><span>Origem <b>Indicação</b></span><span>Etapa <b>Negociação</b></span></div>
      </div></div>
      <div class="acoes">${conversa('agora')}<button class="p">${FONE}Ligar <kbd>L</kbd></button><button class="p main">✓ Concluir <kbd>C</kbd></button><button class="p">Reagendar</button></div>
      <div class="pe"><span>Pular por agora</span><span>Abrir ficha</span></div>
    </section>

    <p class="rotulo">No cabeçalho da ficha</p>
    <section class="ficha">
      <span class="av" style="--s:52px">CM</span>
      <div><h2 class="d">Carla Menezes</h2><span class="st">Lead · Negociação</span></div>
      <div class="acts">${conversa('ficha', true)}<button class="p">${FONE}Ligar</button><button class="p" aria-label="Mais ações">⋯</button></div>
    </section>

    <div class="nota"><b>Quem vê o Stronizap:</b> só a academia com a integração do Stronizap ligada. Sem ela, fica o WhatsApp de sempre, igual a hoje. A mensagem mandada pelo Stronizap volta para a Meta como "Você respondeu pelo Stronizap", com o Concluir pronto.</div>`;
}
document.addEventListener('click', (e) => {
  const o = e.target.closest('[data-op]'); if (o) { op = o.dataset.op; menu = null; render(); return; }
  const m = e.target.closest('[data-menu]'); if (m) { menu = menu === m.dataset.menu ? null : m.dataset.menu; render(); return; }
  const ir = e.target.closest('[data-ir]'); if (ir) { ultimo = ir.dataset.ir; menu = null; render(); return; }
  if (menu && !e.target.closest('.menu')) { menu = null; render(); }
});
render();
</script></body></html>
